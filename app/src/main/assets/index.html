<!DOCTYPE html>
<html lang="uz">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutsch Qadam — Nemis tili</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14213D; --navy-2:#1E3160; --navy-3:#2B4583; --navy-soft:#E4E8F2;
  --cream:#FBF4E8; --cream-2:#F4E9D6; --cream-3:#EADBC1; --paper:#FFFCF6;
  --coral:#FF7A59; --coral-d:#EE6440; --coral-soft:#FFE6DC; --coral-t:#C2461F; --on-c:#3A1206;
  --gold:#F5B83D; --gold-d:#D99A1E; --gold-soft:#FDF0D2; --gold-t:#9A6A08;
  --sand:#B8893F; --sand-soft:#F5E6C8;
  --ink:#14213D; --muted:#6A7186; --ok:#22A06B; --ok-soft:#DDF4EA; --ok-t:#16804F; --bad:#C62F45; --bad-soft:#FBE3E6;
  --nb:#14213D; --side:#14213D; --inp:#ffffff; --hl:#FFF4EE; --tip-t:#5B4418; --tip-b:#3F2E0D; --tipc-t:#7A2A20;
  --r:18px; --shadow:0 6px 24px rgba(20,33,61,.08); --shadow-2:0 10px 34px rgba(20,33,61,.16);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--cream);color:var(--ink);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-.01em;margin:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select{font-family:inherit;font-size:16px}
.app{display:flex;min-height:100vh}

/* ---------- Sidebar ---------- */
.side{width:250px;flex:0 0 250px;background:var(--side);color:#FBF4E8;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px;overflow-y:auto;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px}
.brand-logo{width:42px;height:42px;border-radius:13px;background:var(--coral);display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:800;font-size:20px;color:var(--on-c);box-shadow:0 6px 18px rgba(255,122,89,.4)}
.brand b{font-family:'Fraunces',serif;font-size:20px;display:block;line-height:1.1}
.brand small{color:#AEB8D3;font-size:12px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:#D4DBEC;font-weight:700;font-size:15px;text-align:left;transition:.15s}
.nav button .ic{width:26px;text-align:center;font-size:18px}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:var(--coral);color:var(--on-c);box-shadow:0 6px 16px rgba(255,122,89,.35)}
.side-foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid rgba(255,255,255,.08)}
.xpbox{background:var(--navy-2);border-radius:14px;padding:12px 14px;font-size:13px;color:#C7CFE3}
.xpbox b{color:#fff;font-size:18px;font-family:'Fraunces',serif}
.setbtn{margin-top:10px;width:100%;padding:10px;border-radius:12px;background:rgba(255,255,255,.06);color:#D4DBEC;font-weight:700;font-size:14px}
.setbtn:hover{background:rgba(255,255,255,.12)}

/* ---------- Topbar (mobile) ---------- */
.top{display:none;position:sticky;top:0;z-index:30;background:var(--side);color:#FBF4E8;padding:10px 14px;align-items:center;gap:10px}
.top .brand{padding:0}
.top .brand-logo{width:36px;height:36px;font-size:17px}
.burger{margin-left:auto;width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.08);font-size:20px;color:#fff}
.scrim{display:none;position:fixed;inset:0;background:rgba(20,33,61,.45);z-index:35}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;padding:30px 38px 90px;max-width:1180px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-h h1{font-size:34px;color:var(--navy)}
.page-h p{margin:6px 0 0;color:var(--muted);max-width:620px}
.crumb{font-size:13px;font-weight:800;color:var(--coral-t);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--navy-3);padding:6px 0;margin-bottom:6px}
.back:hover{color:var(--coral-t)}

.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;border:1px solid rgba(20,33,61,.05)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mt{margin-top:18px}.mt2{margin-top:28px}
.muted{color:var(--muted)}
.sec-t{font-size:22px;color:var(--navy);margin:30px 0 14px;display:flex;align-items:center;gap:10px}
.sec-t:first-child{margin-top:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;font-weight:800;font-size:15px;transition:.15s;white-space:nowrap}
.btn-c{background:var(--coral);color:var(--on-c);box-shadow:0 6px 16px rgba(255,122,89,.32)}
.btn-c:hover{background:var(--coral-d);transform:translateY(-1px)}
.btn-n{background:var(--nb);color:#FBF4E8}
.btn-n:hover{background:var(--navy-2)}
.btn-o{background:transparent;border:2px solid var(--cream-3);color:var(--navy)}
.btn-o:hover{border-color:var(--navy);}
.btn-s{padding:8px 14px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* Speaker buttons */
.spk{width:40px;height:40px;flex:0 0 40px;border-radius:50%;background:var(--coral);color:var(--on-c);display:inline-grid;place-items:center;box-shadow:0 4px 12px rgba(255,122,89,.35);transition:.15s}
.spk:hover{transform:scale(1.08);background:var(--coral-d)}
.spk svg{width:19px;height:19px}
.spk.sm{width:32px;height:32px;flex-basis:32px}.spk.sm svg{width:15px;height:15px}
.spk.slow{background:var(--navy-soft);color:var(--navy);box-shadow:none;font-size:15px}
.spk.slow:hover{background:var(--cream-3)}
.spk.big{width:86px;height:86px;flex-basis:86px}.spk.big svg{width:38px;height:38px}
.spk.playing{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,122,89,.55)}70%{box-shadow:0 0 0 14px rgba(255,122,89,0)}100%{box-shadow:0 0 0 0 rgba(255,122,89,0)}}

/* Hero */
.hero{background:var(--nb);color:#FBF4E8;border-radius:26px;padding:34px;position:relative;overflow:hidden}
.hero h1{font-size:40px;color:#fff}
.hero p{color:#C7CFE3;max-width:520px;margin:10px 0 22px;font-size:17px}
.hero .blob{position:absolute;border-radius:50%}
.hero .b1{width:260px;height:260px;background:var(--coral);right:-70px;top:-90px;opacity:.9}
.hero .b2{width:150px;height:150px;background:var(--cream);right:120px;bottom:-80px;opacity:.12}
.hero .b3{width:70px;height:70px;background:var(--sand);right:70px;bottom:40px;opacity:.55}
.hero > *{position:relative}
.hero-flag{display:inline-flex;gap:0;border-radius:6px;overflow:hidden;margin-bottom:12px}
.hero-flag i{width:26px;height:6px;display:block}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.08);border-radius:14px;padding:10px 16px;min-width:110px}
.stat b{display:block;font-family:'Fraunces',serif;font-size:24px;color:#fff}
.stat span{font-size:13px;color:#AEB8D3}

.potd{display:flex;align-items:center;gap:16px}
.potd .de{font-family:'Fraunces',serif;font-size:24px;color:var(--navy);font-weight:700}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--coral-soft);color:var(--coral-t);text-transform:uppercase;letter-spacing:.05em}
.tag.n{background:var(--navy-soft);color:var(--navy-3)}
.tag.ok{background:var(--ok-soft);color:var(--ok-t)}

/* path */
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.step{background:var(--paper);border-radius:16px;padding:16px;text-align:left;box-shadow:var(--shadow);border:2px solid transparent;transition:.15s;display:flex;flex-direction:column;gap:6px}
.step:hover{border-color:var(--coral);transform:translateY(-2px)}
.step .num{width:30px;height:30px;border-radius:50%;background:var(--nb);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.step.done .num{background:var(--ok)}
.step b{font-size:16px}
.step small{color:var(--muted)}

.tile{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;text-align:left;transition:.18s;border:2px solid transparent;display:flex;flex-direction:column;gap:6px;position:relative}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-2);border-color:var(--cream-3)}
.tile .emo{font-size:30px;width:56px;height:56px;border-radius:16px;background:var(--cream-2);display:grid;place-items:center;margin-bottom:6px}
.tile b{font-size:17px;color:var(--navy)}
.tile small{color:var(--muted);font-size:14px}
.tile .done-badge{position:absolute;top:14px;right:14px}
.tile.navy{background:var(--nb);color:#FBF4E8}
.tile.navy b{color:#fff}.tile.navy small{color:#AEB8D3}.tile.navy .emo{background:rgba(255,255,255,.08)}
.tile.coral{background:var(--coral);color:var(--on-c)}
.tile.coral b{color:var(--on-c)}.tile.coral small{color:rgba(58,18,6,.75)}.tile.coral .emo{background:rgba(255,255,255,.18)}

/* Phrase rows */
.phr{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:var(--paper);box-shadow:0 2px 10px rgba(20,33,61,.05);transition:.15s;border:2px solid transparent}
.phr + .phr{margin-top:10px}
.phr.active{border-color:var(--coral);background:var(--hl)}
.phr .txt{flex:1;min-width:0}
.phr .de{font-weight:800;font-size:18px;color:var(--navy)}
.phr .tr{font-size:14px;color:var(--coral-t);font-style:italic;font-weight:700}
.phr .uz{font-size:15px;color:var(--muted)}
.phr .acts{display:flex;gap:8px}
.tip{background:var(--sand-soft);border-left:5px solid var(--sand);border-radius:14px;padding:14px 18px;color:var(--tip-t);font-size:15px}
.tip b{color:var(--tip-b)}
.tip.n{background:var(--navy-soft);border-color:var(--navy-3);color:var(--navy)}
.tip.c{background:var(--coral-soft);border-color:var(--coral);color:var(--tipc-t)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Alphabet */
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.let{background:var(--paper);border-radius:16px;padding:14px 10px 12px;text-align:center;box-shadow:0 2px 10px rgba(20,33,61,.05);border:2px solid transparent;transition:.15s;position:relative}
.let:hover{border-color:var(--coral)}
.let .L{font-family:'Fraunces',serif;font-size:34px;font-weight:800;color:var(--navy);line-height:1}
.let .L small{font-size:22px;color:var(--muted);margin-left:2px}
.let .nm{font-size:13px;color:var(--coral-t);font-weight:800;margin-top:4px}
.let .ex{font-size:13px;color:var(--muted);margin-top:2px}
.let.special{background:var(--nb);}
.let.special .L{color:#fff}.let.special .ex{color:#AEB8D3}.let.special .nm{color:#FF9D91}

.snd{display:flex;gap:16px;align-items:flex-start}
.snd .combo{min-width:78px;height:64px;border-radius:16px;background:var(--nb);color:#fff;display:grid;place-items:center;font-family:'Fraunces',serif;font-size:26px;font-weight:800;padding:0 10px}
.snd .info{flex:1;min-width:0}
.snd .say{font-weight:800;color:var(--coral-t)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:var(--cream-2);font-weight:700;font-size:14px;color:var(--navy);transition:.15s}
.chip:hover{background:var(--coral);color:var(--on-c)}
.chip .mini{font-size:12px;opacity:.75;font-weight:600}
.chip.on{background:var(--nb);color:#fff}

/* Dialog */
.dlg{display:flex;flex-direction:column;gap:12px}
.bub{max-width:78%;padding:12px 16px;border-radius:18px;box-shadow:0 2px 10px rgba(20,33,61,.06);display:flex;gap:10px;align-items:flex-start;border:2px solid transparent}
.bub.a{background:var(--paper);align-self:flex-start;border-bottom-left-radius:5px}
.bub.b{background:var(--nb);color:#FBF4E8;align-self:flex-end;border-bottom-right-radius:5px}
.bub.active{border-color:var(--coral)}
.bub .who{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--coral-t)}
.bub .de{font-weight:800;font-size:17px}
.bub.a .de{color:var(--navy)}
.bub .uz{font-size:14px;opacity:.75}
.hide-uz .bub .uz{display:none}

/* Numbers */
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.nbox{background:var(--paper);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(20,33,61,.05);text-align:left;border:2px solid transparent;transition:.15s}
.nbox:hover{border-color:var(--coral)}
.nbox .n{font-family:'Fraunces',serif;font-size:26px;font-weight:800;color:var(--coral-t);min-width:44px}
.nbox .w{font-weight:800;color:var(--navy);font-size:15px;line-height:1.2}
.nbox .t{font-size:12px;color:var(--muted)}
.tabs{display:inline-flex;background:var(--cream-2);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.tabs button{padding:9px 16px;border-radius:11px;font-weight:800;color:var(--navy);font-size:14px}
.tabs button.on{background:var(--nb);color:#fff}
.inp{width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--cream-3);background:var(--inp);color:var(--navy);font-weight:700;font-size:18px;outline:none;transition:.15s}
.inp:focus{border-color:var(--coral)}
.conv-out{font-family:'Fraunces',serif;font-size:28px;font-weight:700;color:var(--navy);word-break:break-word}
.breakdown{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.breakdown span{background:var(--cream-2);padding:5px 10px;border-radius:9px;font-weight:700;font-size:14px}
.breakdown span.p{background:var(--coral-soft);color:var(--coral-t)}

/* Vocab */
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.vw{background:var(--paper);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(20,33,61,.05);border-left:5px solid var(--cream-3)}
.vw.der{border-left-color:var(--navy-3)}.vw.die{border-left-color:var(--coral)}.vw.das{border-left-color:var(--sand)}
.vw .txt{flex:1;min-width:0}
.vw .de{font-weight:800;color:var(--navy);font-size:16px}
.vw .tr{font-size:13px;color:var(--coral-t);font-style:italic;font-weight:700}
.vw .uz{font-size:14px;color:var(--muted)}
.vw .chk{font-size:14px;color:var(--ok-t);font-weight:800}
.art{font-weight:800}
.art.der{color:var(--navy-3)}.art.die{color:var(--coral-t)}.art.das{color:var(--sand)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;font-weight:700}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}

/* flashcard */
.fc-wrap{perspective:1200px;max-width:520px;margin:0 auto}
.fc{position:relative;height:300px;transform-style:preserve-3d;transition:transform .55s;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;box-shadow:var(--shadow-2)}
.fc .front{background:var(--nb);color:#fff}
.fc .back{background:var(--paper);transform:rotateY(180deg);color:var(--navy)}
.fc .big{font-family:'Fraunces',serif;font-size:36px;font-weight:800;line-height:1.15}
.fc .hint{font-size:13px;opacity:.6;margin-top:14px}
.fc .tr{color:var(--coral-t);font-style:italic;font-weight:700;margin-top:8px}
.fc-ctrl{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}

/* Quiz */
.qwrap{max-width:720px;margin:0 auto}
.pbar{height:10px;background:var(--cream-2);border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),#FFA07F);border-radius:999px;transition:width .3s}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800;color:var(--muted);font-size:14px}
.qcard{background:var(--paper);border-radius:24px;box-shadow:var(--shadow-2);padding:30px;text-align:center;margin-top:16px}
.qcard .ask{font-size:14px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.qcard .prompt{font-family:'Fraunces',serif;font-size:34px;font-weight:800;color:var(--navy);margin:14px 0 6px;line-height:1.2;word-break:break-word}
.qcard .sub{color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.opt{padding:16px;border-radius:16px;background:var(--cream);border:2px solid var(--cream-3);font-weight:800;color:var(--navy);font-size:16px;transition:.15s;text-align:center;min-height:62px}
.opt:hover:not(:disabled){border-color:var(--navy);background:var(--inp)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok-t)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:18px;font-weight:800;min-height:26px}
.fb.ok{color:var(--ok-t)}.fb.bad{color:var(--bad)}
.result{text-align:center}
.result .score{font-family:'Fraunces',serif;font-size:64px;font-weight:800;color:var(--coral-t);line-height:1}
.ring{width:150px;height:150px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center}
.ring > div{width:118px;height:118px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:'Fraunces',serif;font-size:34px;font-weight:800;color:var(--navy)}
.review{text-align:left;margin-top:20px}
.review .r{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bad-soft);margin-top:8px}
.review .r b{color:var(--navy)}

.cfg label{font-weight:800;color:var(--navy);display:block;margin-bottom:8px}
.cfg .row{margin-bottom:20px}
.sel{appearance:none;-webkit-appearance:none;width:100%;padding:12px 14px;border-radius:13px;border:2px solid var(--cream-3);background:var(--inp);color:var(--navy);font-weight:700;outline:none}
.sel:focus{border-color:var(--coral)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.mode{padding:14px;border-radius:16px;border:2px solid var(--cream-3);background:var(--inp);text-align:left;transition:.15s}
.mode b{display:block;color:var(--navy)}
.mode small{color:var(--muted);font-size:13px}
.mode.on{border-color:var(--coral);background:var(--hl);box-shadow:0 0 0 3px var(--coral-soft)}
.mode .e{font-size:22px}

/* Games */
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pill{background:var(--nb);color:#fff;border-radius:999px;padding:7px 14px;font-weight:800;font-size:14px}
.pill.c{background:var(--coral)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:720px;margin:0 auto}
.mc{aspect-ratio:1/.8;perspective:800px}
.mc .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s}
.mc.open .in,.mc.got .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;padding:8px;text-align:center}
.mc .f{background:var(--nb);color:var(--coral-t);font-family:'Fraunces',serif;font-size:30px;font-weight:800;box-shadow:var(--shadow)}
.mc .f::after{content:'?'}
.mc .b{background:var(--paper);transform:rotateY(180deg);font-weight:800;color:var(--navy);font-size:15px;box-shadow:var(--shadow);border:2px solid var(--cream-3);word-break:break-word}
.mc .b.de{color:var(--coral-t)}
.mc.got .b{background:var(--ok-soft);border-color:var(--ok);color:var(--ok-t)}
.mc.shake .in{animation:shake .4s}
@keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0)}25%{transform:rotateY(180deg) translateX(-6px)}75%{transform:rotateY(180deg) translateX(6px)}}

.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;min-height:62px;padding:12px;border-radius:16px;background:var(--cream);border:2px dashed var(--cream-3);margin-top:18px}
.slots.ok{border-color:var(--ok);background:var(--ok-soft)}
.slots.bad{border-color:var(--bad);background:var(--bad-soft)}
.pool{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.lt{min-width:46px;height:50px;padding:0 14px;border-radius:13px;background:var(--nb);color:#fff;font-weight:800;font-size:20px;box-shadow:0 4px 0 #0B1428;transition:.1s}
.lt:active{transform:translateY(3px);box-shadow:0 1px 0 #0B1428}
.lt.w{font-size:17px}
.lt.used{visibility:hidden}
.slots .lt{background:var(--coral);box-shadow:0 4px 0 var(--coral-d)}
.umls{display:flex;gap:8px;justify-content:center;margin-top:10px}
.umls button{width:46px;height:42px;border-radius:11px;background:var(--cream-2);font-weight:800;font-size:18px;color:var(--navy)}
.umls button:hover{background:var(--coral);color:var(--on-c)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.tf button{padding:20px;border-radius:18px;font-weight:800;font-size:18px;color:#fff}
.tf .y{background:var(--ok)}.tf .n{background:var(--bad)}
.timer{font-family:'Fraunces',serif;font-size:40px;font-weight:800;color:var(--coral-t)}

/* Grammar */
.gtbl{width:100%;border-collapse:separate;border-spacing:0;margin-top:10px;overflow:hidden;border-radius:14px}
.gtbl th{background:var(--nb);color:#fff;text-align:left;padding:10px 14px;font-size:14px}
.gtbl td{padding:10px 14px;border-bottom:1px solid var(--cream-2);background:var(--inp)}
.gtbl tr:last-child td{border-bottom:none}
.gtbl td.de{font-weight:800;color:var(--navy)}
.gtbl td .spk{vertical-align:middle}
.ex-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.ex-row .de{font-weight:800;color:var(--navy)}
.ex-row .uz{color:var(--muted);font-size:14px}
.ex-h{margin:16px 0 4px;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--coral-t)}
.ex-row + .ex-row{border-top:1px dashed var(--line, rgba(20,33,61,.12))}

/* misc */
.search{position:relative;max-width:360px;flex:1}
.search input{padding-left:42px}
.search::before{content:'🔎';position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px}
.voice-warn{display:flex;gap:12px;align-items:center}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--nb);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;box-shadow:var(--shadow-2);opacity:0;transition:.25s;z-index:100;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-bg{position:fixed;inset:0;background:rgba(20,33,61,.5);z-index:90;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--paper);border-radius:24px;padding:26px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-2)}
.modal h2{color:var(--navy);font-size:24px;margin-bottom:16px}
.range{width:100%;accent-color:var(--coral)}
.made{position:fixed;right:16px;bottom:14px;z-index:80;background:var(--nb);color:#FBF4E8;padding:8px 14px 8px 12px;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:.02em;box-shadow:0 6px 18px rgba(20,33,61,.28);display:flex;align-items:center;gap:8px;pointer-events:none;user-select:none}
.made i{width:8px;height:8px;border-radius:50%;background:var(--coral);display:block;box-shadow:0 0 0 3px rgba(255,122,89,.25)}
.made b{color:var(--coral-t)}
.empty{text-align:center;padding:30px;color:var(--muted)}
.confetti{position:fixed;top:-10px;width:10px;height:14px;z-index:95;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}


/* ---------- Tungi rejim ---------- */
html[data-theme="dark"]{
  --cream:#0D1529; --cream-2:#1A2645; --cream-3:#2B3A66; --paper:#141F3A;
  --ink:#EFE6D4; --navy:#F1E8D6; --navy-3:#93ABEB; --navy-soft:#24335C; --navy-2:#1E2D57;
  --nb:#22315C; --side:#0A1122; --inp:#0F1932; --hl:#2C1F2E;
  --coral-d:#FF916F; --coral-soft:#3B2420; --coral-t:#FF9A7E; --gold-soft:#3A2E12; --gold-t:#F5C45E; --muted:#9BA7C5;
  --sand:#D9A957; --sand-soft:#2B2416; --tip-t:#E9D3A6; --tip-b:#F6E3BC; --tipc-t:#FFC2B9;
  --ok:#3CC48A; --ok-soft:#163629; --ok-t:#4CC290; --bad:#F2556D; --bad-soft:#3A1C22;
  --shadow:0 6px 24px rgba(0,0,0,.35); --shadow-2:0 10px 34px rgba(0,0,0,.5);
  color-scheme:dark;
}
html[data-theme="dark"] .card, html[data-theme="dark"] .tile, html[data-theme="dark"] .step{border-color:rgba(255,255,255,.04)}
html[data-theme="dark"] .hero .b2{opacity:.06}
html[data-theme="dark"] .lt{box-shadow:0 4px 0 #070D1C}
body, .card, .tile, .phr, .vw, .opt, .chip, .side, .main{transition:background-color .25s, color .25s, border-color .25s}

/* ---------- Mavzu tugmasi va hikmatlar ---------- */
.theme-btn{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.08);font-size:19px;color:#fff;display:grid;place-items:center}
.top .theme-btn{margin-left:auto}
.top .burger{margin-left:8px}
.quote{min-height:96px;margin:12px 0 22px;max-width:560px;cursor:pointer;transition:opacity .45s}
.quote.fade{opacity:0}
.quote .q-de{font-family:'Fraunces',Georgia,serif;font-size:21px;font-style:italic;color:#fff;line-height:1.35}
.quote .q-de::before{content:'„';color:var(--coral-t);margin-right:2px}
.quote .q-de::after{content:'“';color:var(--coral-t);margin-left:2px}
.quote .q-uz{color:#C7CFE3;font-size:15px;margin-top:6px}
.quote .q-au{color:#FF9D91;font-size:13px;font-weight:800;margin-top:4px;letter-spacing:.02em}
.qdots{display:flex;gap:5px;margin-top:10px}
.qdots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);transition:.3s}
.qdots i.on{background:var(--coral);width:18px;border-radius:4px}
.name-modal{text-align:center}
.name-modal .wave{font-size:54px;line-height:1}


/* =================== STARTAP QATLAMI =================== */
/* --- Kirish animatsiyalari --- */
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes qin{from{opacity:0;transform:translateX(26px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.7)}15%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-5px)}}
@keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(255,122,89,.55),0 6px 0 var(--pn-sh)}70%{box-shadow:0 0 0 16px rgba(255,122,89,0),0 6px 0 var(--pn-sh)}100%{box-shadow:0 0 0 0 rgba(255,122,89,0),0 6px 0 var(--pn-sh)}}
@keyframes flame{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.12) rotate(3deg)}}
@keyframes starIn{0%{opacity:0;transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25) rotate(8deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes bannerIn{from{opacity:0;transform:translate(-50%,-30px)}}
@keyframes celebIn{from{opacity:0;transform:scale(.6)}}
.main.enter{animation:fadeIn .3s ease}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards}
.qin{animation:qin .38s cubic-bezier(.2,.8,.2,1) backwards}
.opt.right{animation:pop .4s ease}
.opt.wrong{animation:shakeX .45s ease}
.btn:active,.tile:active,.step:active,.opt:active:not(:disabled),.chip:active,.pnode:active{transform:scale(.96)}
.wave-hand{display:inline-block;transform-origin:70% 80%;animation:wave 2.2s ease .4s 1}
.xp-float{position:fixed;z-index:120;pointer-events:none;font-weight:800;font-size:18px;color:var(--gold-t);text-shadow:0 2px 8px rgba(0,0,0,.15);animation:floatUp 1.1s ease forwards;white-space:nowrap}

/* --- Ochilish ekrani (splash) --- */
#splash{position:fixed;inset:0;z-index:200;background:#14213D;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .45s ease}
#splash.hide{opacity:0;pointer-events:none}
#splash .sp-logo{width:96px;height:96px;border-radius:28px;background:#FF7A59;color:var(--on-c);display:grid;place-items:center;font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:48px;box-shadow:0 16px 40px rgba(255,122,89,.45);animation:celebIn .6s cubic-bezier(.2,1.4,.4,1) backwards}
#splash .sp-name{font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:30px;color:#fff;animation:rise .6s .25s ease backwards}
#splash .sp-tag{color:#AEB8D3;font-weight:700;animation:rise .6s .4s ease backwards}
#splash .sp-flag{display:flex;border-radius:5px;overflow:hidden;margin-top:6px;animation:fadeIn .6s .55s backwards}
#splash .sp-flag i{width:30px;height:6px;display:block}

/* --- Onboarding --- */
#onb{position:fixed;inset:0;z-index:150;background:var(--cream);display:none;flex-direction:column;overflow-y:auto}
#onb.show{display:flex}
.ob-top{display:flex;align-items:center;gap:12px;padding:16px 20px;max-width:620px;width:100%;margin:0 auto}
.ob-back{width:40px;height:40px;border-radius:12px;background:var(--cream-2);font-size:18px;color:var(--navy);flex:0 0 40px}
.ob-back[disabled]{visibility:hidden}
.ob-prog{flex:1;height:10px;border-radius:999px;background:var(--cream-2);overflow:hidden}
.ob-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),#FFA07F);border-radius:999px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.ob-body{flex:1;max-width:620px;width:100%;margin:0 auto;padding:10px 22px 30px;display:flex;flex-direction:column}
.ob-body.fwd{animation:qin .4s cubic-bezier(.2,.8,.2,1) backwards}
.ob-body.bwd{animation:qin .4s cubic-bezier(.2,.8,.2,1) reverse backwards}
.ob-body h1{font-size:32px;color:var(--navy);margin:10px 0 8px}
.ob-body p.lead{color:var(--muted);font-size:17px;margin:0 0 22px}
.ob-logo{width:110px;height:110px;border-radius:32px;background:var(--coral);color:var(--on-c);display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:800;font-size:56px;margin:26px auto 18px;box-shadow:0 18px 40px rgba(255,122,89,.4);animation:celebIn .7s cubic-bezier(.2,1.4,.4,1) backwards}
.ob-feat{display:flex;gap:14px;align-items:center;padding:14px 16px;background:var(--paper);border-radius:16px;box-shadow:var(--shadow);margin-bottom:10px}
.ob-feat .fi{font-size:26px;width:46px;height:46px;border-radius:14px;background:var(--cream-2);display:grid;place-items:center;flex:0 0 46px}
.ob-feat b{color:var(--navy);display:block}
.ob-feat small{color:var(--muted)}
.ob-opts{display:grid;gap:12px}
.ob-opt{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;background:var(--paper);border:2px solid var(--cream-3);text-align:left;transition:.15s;box-shadow:0 2px 10px rgba(20,33,61,.05)}
.ob-opt .oi{font-size:28px}
.ob-opt b{color:var(--navy);display:block;font-size:17px}
.ob-opt small{color:var(--muted)}
.ob-opt .ox{margin-left:auto;font-weight:800;color:var(--coral-t);white-space:nowrap}
.ob-opt.on{border-color:var(--coral);background:var(--hl);box-shadow:0 0 0 3px var(--coral-soft)}
.ob-foot{margin-top:auto;padding-top:24px}
.ob-foot .btn{width:100%;padding:16px;font-size:17px}

/* --- Bosh sahifa: daraja, maqsad, seriya --- */
.hero-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:4px}
.lvl-chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:999px;padding:7px 14px;font-weight:800;font-size:14px;color:#fff}
.xpbar{flex:1;min-width:140px;max-width:300px}
.xpbar .bar{height:10px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
.xpbar .bar i{display:block;height:100%;background:linear-gradient(90deg,#F5B83D,#FFD27A);border-radius:999px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.xpbar small{color:#AEB8D3;font-size:12px;font-weight:700}
.dash{display:grid;grid-template-columns:1.1fr 1fr 1.4fr;gap:16px;margin-top:18px}
.dcard{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:flex;align-items:center;gap:16px;border:1px solid rgba(20,33,61,.05)}
.dcard h4{margin:0;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dcard .big{font-family:'Fraunces',serif;font-size:26px;font-weight:800;color:var(--navy);line-height:1.1}
.dcard small{color:var(--muted)}
.gring{width:84px;height:84px;flex:0 0 84px;position:relative}
.gring svg{width:84px;height:84px;transform:rotate(-90deg)}
.gring .bg{fill:none;stroke:var(--cream-2);stroke-width:9}
.gring .fg{fill:none;stroke:var(--gold);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.gring .ct{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;color:var(--navy);font-size:15px;text-align:center;line-height:1.1}
.gring .ct small{display:block;font-size:10px;color:var(--muted)}
.flame{font-size:44px;display:inline-block;animation:flame 1.6s ease-in-out infinite}
.flame.off{filter:grayscale(1);opacity:.45;animation:none}
.cont{background:linear-gradient(135deg,var(--coral),#FFA07F);color:var(--on-c);border:none}
.cont h4{color:rgba(58,18,6,.72)}.cont .big{color:var(--on-c);font-size:20px}.cont small{color:rgba(58,18,6,.75)}
.cont .nic{font-size:34px;width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.35);display:grid;place-items:center;flex:0 0 58px}
.cont .btn{background:var(--navy-x,#14213D);color:#fff;margin-top:8px;padding:9px 16px;font-size:14px}

/* --- O'rganish yo'li --- */
.path-wrap{--k:1;max-width:560px;margin:0 auto}
.unit{border-radius:20px;padding:18px 20px;color:#fff;background:var(--uc);display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 22px;box-shadow:0 8px 24px rgba(20,33,61,.15)}
.unit:first-child{margin-top:0}
.unit .ut{font-size:12px;font-weight:800;letter-spacing:.08em;opacity:.85;text-transform:uppercase}
.unit b{font-family:'Fraunces',serif;font-size:21px;display:block}
.unit small{opacity:.85}
.unit .uprog{background:rgba(255,255,255,.18);border-radius:12px;padding:8px 12px;font-weight:800;white-space:nowrap}
.unit.uc-c{color:var(--on-c)}.unit.uc-c .uprog{background:rgba(255,255,255,.4)}
.prow{display:flex;justify-content:center;margin-bottom:18px}
.prow.cur-row{margin-top:46px}
.prow .pin{display:flex;flex-direction:column;align-items:center;transform:translateX(calc(var(--x) * var(--k) * 1px))}
.main{overflow-x:clip}
.pnode{--pn-bg:var(--cream-3);--pn-sh:#c9b796;width:76px;height:72px;border-radius:50%;background:var(--pn-bg);box-shadow:0 6px 0 var(--pn-sh);display:grid;place-items:center;font-size:30px;position:relative;transition:transform .12s}
html[data-theme="dark"] .pnode{--pn-sh:#1b2747}
.pnode.done{--pn-bg:var(--gold);--pn-sh:var(--gold-d)}
.pnode.cur{--pn-bg:var(--coral);--pn-sh:#D35A3A;animation:ringPulse 1.8s infinite}
.pnode.lock{filter:grayscale(1);opacity:.55}
.pnode.exam{border-radius:24px;--pn-bg:var(--sand);--pn-sh:#8a6526}
.pnode.exam.lock{--pn-bg:var(--cream-3)}
.pnode.final{width:96px;height:90px;border-radius:30px;font-size:40px;--pn-bg:#14213D;--pn-sh:#060b17}
html[data-theme="dark"] .pnode.final{--pn-bg:#2B4583;--pn-sh:#121d3a}
.pnode .pchk{position:absolute;right:-4px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;font-size:14px;font-weight:800;display:grid;place-items:center;border:3px solid var(--cream)}
.pnode .plk{position:absolute;right:-4px;bottom:-2px;font-size:18px;filter:none}
.pnode .bubble{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);background:var(--paper);color:var(--coral-t);font-size:13px;font-weight:800;padding:7px 12px;border-radius:12px;white-space:nowrap;box-shadow:var(--shadow);border:2px solid var(--coral-soft);animation:bob 1.6s ease-in-out infinite;letter-spacing:.04em}
.pnode .bubble::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--paper)}
.plabel{margin-top:12px;font-weight:800;color:var(--navy);font-size:14px;text-align:center;max-width:150px}
.plabel small{display:block;color:var(--muted);font-weight:700;font-size:12px}

/* --- Tugun oynasi --- */
.nsheet{text-align:center}
.nsheet .nbig{width:92px;height:92px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:42px;background:var(--coral);box-shadow:0 6px 0 #D35A3A}
.nsheet .nbig.lock{background:var(--cream-3);box-shadow:0 6px 0 #c9b796;filter:grayscale(1)}
.nsheet .nbig.exam{border-radius:28px;background:var(--sand);box-shadow:0 6px 0 #8a6526}
.nsheet .nunit{font-size:12px;font-weight:800;color:var(--coral-t);letter-spacing:.08em;text-transform:uppercase}
.nsheet h2{margin:6px 0 8px}
.nsheet p{color:var(--muted);margin:0 0 14px}
.nsheet .nbtns{display:grid;gap:10px;margin-top:16px}
.nsheet .nbtns .btn{width:100%}

/* --- Natija ekrani --- */
.stars{display:flex;justify-content:center;gap:10px;margin:6px 0 10px;font-size:40px}
.stars span{display:inline-block;filter:grayscale(1);opacity:.3}
.stars span.on{filter:none;opacity:1;animation:starIn .55s cubic-bezier(.2,1.4,.4,1) backwards}
.stars span.on:nth-child(2){animation-delay:.18s}.stars span.on:nth-child(3){animation-delay:.36s}
.unlock-msg{margin:12px auto 4px;max-width:420px;background:var(--ok-soft);color:var(--ok-t);font-weight:800;border-radius:14px;padding:12px 16px;animation:rise .5s .5s backwards}
.fail-msg{margin:12px auto 4px;max-width:420px;background:var(--coral-soft);color:var(--coral-t);font-weight:800;border-radius:14px;padding:12px 16px}

/* --- Bayramlar (yutuq, daraja, maqsad) --- */
.banner{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:130;background:var(--paper);border-radius:18px;box-shadow:var(--shadow-2);padding:12px 18px 12px 12px;display:flex;align-items:center;gap:12px;min-width:260px;max-width:92vw;border:2px solid var(--sand);animation:bannerIn .45s cubic-bezier(.2,1.2,.4,1);transition:opacity .35s,transform .35s}
.banner.out{opacity:0;transform:translate(-50%,-20px)}
.banner .bi{font-size:30px;width:50px;height:50px;border-radius:14px;background:var(--sand-soft);display:grid;place-items:center;flex:0 0 50px}
.banner small{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sand)}
.banner b{color:var(--navy)}
#celeb{position:fixed;inset:0;z-index:140;background:rgba(20,33,61,.7);display:none;align-items:center;justify-content:center;padding:20px}
#celeb.show{display:flex}
#celeb .cbox{background:var(--paper);border-radius:28px;padding:30px 28px;text-align:center;max-width:360px;width:100%;animation:celebIn .5s cubic-bezier(.2,1.4,.4,1)}
#celeb .cbig{font-size:64px;line-height:1}
#celeb .clv{font-family:'Fraunces',serif;font-size:54px;font-weight:800;color:var(--coral-t);line-height:1;margin:8px 0}
#celeb h2{color:var(--navy);margin:6px 0}
#celeb p{color:var(--muted);margin:6px 0 18px}

/* --- Statistika --- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--paper);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);border:1px solid rgba(20,33,61,.05)}
.kpi small{color:var(--muted);font-weight:700;font-size:13px}
.kpi b{display:block;font-family:'Fraunces',serif;font-size:28px;color:var(--navy);margin-top:2px}
.kpi .sub{color:var(--muted);font-size:12px;font-weight:700}
.chart{position:relative;height:220px;display:flex;align-items:flex-end;gap:12px;padding:20px 6px 0;border-bottom:1px solid var(--cream-3)}
.chart .goal{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);opacity:.55}
.chart .goal span{position:absolute;left:0;top:-20px;background:var(--paper);padding:0 4px;border-radius:4px;font-size:12px;font-weight:700;color:var(--muted)}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;cursor:default}
.chart .bar{width:100%;max-width:38px;border-radius:4px 4px 0 0;background:var(--navy-3);height:0;transition:height .8s cubic-bezier(.2,.8,.2,1);min-height:2px}
html[data-theme="dark"] .chart .bar{background:#6F8CD8}
.chart .col.today .bar{background:var(--coral)}
.chart .val{font-size:12px;font-weight:800;color:var(--navy);margin-bottom:4px;opacity:0}
.chart .col.today .val,.chart .col:hover .val,.chart .col.show .val{opacity:1}
.chart-x{display:flex;gap:12px;padding:6px 6px 0}
.chart-x span{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.chart-x span.today{color:var(--coral-t)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:420px}
.heat i{aspect-ratio:1;border-radius:6px;background:var(--cream-2);display:block;position:relative}
.heat i.l1{background:#FFDCCF}.heat i.l2{background:#FFAA8C}.heat i.l3{background:#FF7A59}.heat i.l4{background:#D35A3A}
html[data-theme="dark"] .heat i.l1{background:#5A2B33}html[data-theme="dark"] .heat i.l2{background:#94403D}html[data-theme="dark"] .heat i.l3{background:#D85A4C}html[data-theme="dark"] .heat i.l4{background:#FF8B7E}
.heat i.tdy{outline:2px solid var(--navy);outline-offset:1px}
.heat-h{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:420px;margin-bottom:6px}
.heat-h span{font-size:11px;font-weight:800;color:var(--muted);text-align:center}
.legend2{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:700;margin-top:10px}
.legend2 i{width:14px;height:14px;border-radius:4px;display:inline-block}
.catrow{display:grid;grid-template-columns:30px 1fr 64px 60px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--cream-2)}
.catrow:last-child{border-bottom:none}
.catrow .cn{font-weight:700;color:var(--navy);font-size:14px}
.catrow .cb{height:8px;border-radius:999px;background:var(--cream-2);overflow:hidden;margin-top:5px}
.catrow .cb i{display:block;height:100%;background:var(--navy-3);border-radius:999px}
.catrow .cv{font-weight:800;color:var(--navy);font-size:13px;text-align:right}
.catrow .ca{font-size:12px;font-weight:800;text-align:right;color:var(--muted)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ach{background:var(--paper);border-radius:16px;padding:14px 12px;text-align:center;box-shadow:var(--shadow);border:2px solid transparent}
.ach .ai{font-size:34px;width:60px;height:60px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:var(--sand-soft)}
.ach b{display:block;color:var(--navy);font-size:14px}
.ach small{color:var(--muted);font-size:12px;line-height:1.3;display:block;margin-top:2px}
.ach.on{border-color:var(--gold)}.ach.on .ai{background:var(--gold-soft)}
.ach.off .ai{filter:grayscale(1);opacity:.35;background:var(--cream-2)}
.ach.off b{color:var(--muted)}

/* --- Sertifikat --- */
.cert{max-width:720px;margin:0 auto;background:var(--paper);border-radius:22px;padding:14px;box-shadow:var(--shadow-2)}
.cert .ci{border:3px double var(--sand);border-radius:16px;padding:36px 28px;text-align:center;position:relative;background:linear-gradient(180deg,var(--paper),var(--sand-soft))}
.cert .ct{font-size:13px;letter-spacing:.3em;font-weight:800;color:var(--sand)}
.cert h1{font-size:40px;color:var(--navy);margin:8px 0 2px}
.cert .cn{font-family:'Fraunces',serif;font-size:42px;font-weight:800;color:var(--coral-t);margin:18px 0 8px;font-style:italic}
.cert p{color:var(--muted);max-width:480px;margin:0 auto}
.cert .seal{width:86px;height:86px;border-radius:50%;background:var(--coral);color:var(--on-c);display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:800;font-size:28px;margin:22px auto 10px;box-shadow:0 0 0 6px var(--coral-soft)}
.cert .crow{display:flex;justify-content:space-around;gap:10px;margin-top:18px;flex-wrap:wrap}
.cert .crow div{font-size:13px;color:var(--muted)}
.cert .crow b{display:block;color:var(--navy);font-size:16px}

@media (max-width:860px){
  .dash{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .path-wrap{--k:.72}
  .chart{gap:7px}.chart-x{gap:7px}
  .catrow{grid-template-columns:26px 1fr 56px 46px}
  .cert h1{font-size:30px}.cert .cn{font-size:32px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}


/* --- Talaffuz (mikrofon) --- */
@keyframes micPulse{0%{box-shadow:0 0 0 0 rgba(255,122,89,.6),0 8px 0 #D35A3A}100%{box-shadow:0 0 0 28px rgba(255,122,89,0),0 8px 0 #D35A3A}}
.pron{text-align:center}
.pron .ask{font-size:14px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pron-de{font-family:'Fraunces',Georgia,serif;font-size:28px;font-weight:800;color:var(--navy);margin:10px 0 4px;line-height:1.25;word-break:break-word}
.pw-ok{color:var(--ok-t)}
.pw-bad{color:var(--bad);text-decoration:underline wavy;text-underline-offset:5px}
.pron-tr{color:var(--coral-t);font-style:italic;font-weight:700}
.pron-ctrl{display:flex;gap:8px;justify-content:center;margin-top:12px}
.mic{--lv:1;width:96px;height:96px;border-radius:50%;background:var(--coral);color:var(--on-c);font-size:40px;display:grid;place-items:center;margin:22px auto 22px;box-shadow:0 8px 0 #D35A3A,0 10px 24px rgba(255,122,89,.3);transition:transform .1s linear}
.mic.listen{transform:scale(var(--lv));animation:micPulse 1.2s infinite}
.mic.proc{background:var(--navy-3);box-shadow:0 8px 0 #1b2e5c}
.pron-hint{font-weight:700;color:var(--muted);font-size:14px}
.pron-res{display:flex;align-items:center;gap:14px;text-align:left;border-radius:16px;padding:12px 16px;margin-top:16px;animation:rise .4s ease backwards}
.pron-res.ok{background:var(--ok-soft)}.pron-res.mid{background:var(--sand-soft)}.pron-res.bad{background:var(--bad-soft)}
.pron-score{font-family:'Fraunces',serif;font-size:34px;font-weight:800;min-width:64px;text-align:center}
.pron-res.ok .pron-score{color:var(--ok-t)}.pron-res.mid .pron-score{color:var(--sand)}.pron-res.bad .pron-score{color:var(--bad)}
.pron-res b{color:var(--navy)}
.pron-note{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.4}
.spk.mic-s{background:var(--nb);box-shadow:none;font-size:16px}


/* --- Darajalar va grammatika --- */
.lvtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:560px;margin:0 auto 22px}
.lvtab{position:relative;overflow:hidden;background:var(--paper);border:2px solid var(--cream-3);border-radius:16px;padding:10px 8px 14px;text-align:center;box-shadow:var(--shadow)}
.lvtab b{display:block;font-family:'Fraunces',serif;font-size:22px;color:var(--navy)}
.lvtab small{color:var(--muted);font-weight:700;font-size:12px}
.lvtab i{position:absolute;left:0;bottom:0;height:5px;background:var(--coral);border-radius:0 4px 4px 0}
.lvtab.on{border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-soft)}
.card.soon{text-align:center;max-width:620px;margin:0 auto}
.card.soon .chips{margin-top:14px}
.pnode.gram{--pn-bg:#2B4583;--pn-sh:#16264d}
.pnode.gram.done{--pn-bg:var(--gold);--pn-sh:var(--gold-d)}.pnode.gram.cur{--pn-bg:var(--coral);--pn-sh:#D35A3A}
.gprompt{font-size:26px !important}
.gap{display:inline-block;min-width:60px;border-bottom:3px dashed var(--coral);color:var(--coral-t);padding:0 6px}
.gap.ok{border-bottom-style:solid;border-color:var(--ok);color:var(--ok-t)}
.gap.bad{border-bottom-style:solid;border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.qtype.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-t)}
.qtype.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.gtheory h3{color:var(--navy);font-size:20px;margin-bottom:10px}
.gtxt{font-size:16px;line-height:1.65;color:var(--ink)}
.gtxt b{color:var(--coral-t)}

@media (max-width:1050px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{display:block}
  .side{position:fixed;left:0;top:0;transform:translateX(-105%);transition:transform .25s;box-shadow:var(--shadow-2)}
  .side.open{transform:none}
  .scrim.open{display:block}
  .top{display:flex}
  .main{padding:20px 16px 90px}
  .page-h h1{font-size:28px}
  .hero{padding:26px 22px}.hero h1{font-size:32px}
  .hero .b2,.hero .b3{display:none}.hero .b1{width:180px;height:180px;right:-70px;top:-70px}
  .stat{min-width:0;flex:1 1 40%}
  .made{right:10px;bottom:10px;font-size:12px;padding:6px 12px 6px 10px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .qcard{padding:22px 16px}.qcard .prompt{font-size:28px}
  .mem{grid-template-columns:repeat(3,1fr);gap:8px}
  .mc .b{font-size:13px}
  .phr{padding:12px}
  .phr .de{font-size:16px}
  .bub{max-width:92%}
  .fc{height:260px}.fc .big{font-size:30px}
}

/* =====================================================================
   BREZI — maskot va jonli effektlar
   ===================================================================== */
.bz{display:inline-block;position:relative;width:var(--bz,88px);height:calc(var(--bz,88px) * 1.0667);cursor:pointer;-webkit-tap-highlight-color:transparent;flex:0 0 auto;user-select:none}
.bz-svg{width:100%;height:100%;overflow:visible;display:block}
.bz-body,.bz-arm{transform-box:view-box}
.bz-body{transform-origin:60px 122px}
.bz-arm.l{transform-origin:24px 88px;transition:transform .35s}
.bz-arm.r{transform-origin:96px 88px;transition:transform .35s}
.bz .o{fill:none;stroke:#8C4F1C;stroke-width:22;stroke-linecap:round;stroke-linejoin:round}
.bz .d{fill:none;stroke:#DC8F42;stroke-width:16;stroke-linecap:round;stroke-linejoin:round}
.bz .o.belly{stroke-width:32}.bz .d.belly{stroke-width:26}
.bz .hl{fill:none;stroke:#F6C07E;stroke-width:3.5;stroke-linecap:round;opacity:.85}
.bz .salt{fill:#FFFDF7}
.bz-arm path{fill:none;stroke:#8C4F1C;stroke-width:6;stroke-linecap:round}
.bz-arm circle{fill:#DC8F42;stroke:#8C4F1C;stroke-width:2.5}
.bz-feet ellipse{fill:#8C4F1C}
.bz-shadow{fill:rgba(20,33,61,.16)}
html[data-theme="dark"] .bz-shadow{fill:rgba(0,0,0,.35)}
.bz-eye{fill:#14213D;transform-box:fill-box;transform-origin:center;animation:bzBlink 4.6s infinite}
.bz-eye.r{animation-delay:.04s}
.bz-glint{fill:#fff}
.bz-cheek{fill:#FF7A6B;opacity:.55}
.bz-m{display:none}
.bz-m.m-open{fill:#14213D}.bz-m.m-open .tg{fill:#FF7A6B}
.bz-m path.ln,.bz-sq path,.bz-cl path{fill:none;stroke:#14213D;stroke-width:2.6;stroke-linecap:round}
.bz-m.m-o{fill:#14213D}
.bz-sq,.bz-cl,.bz-x{display:none}
.bz-eyes{transition:transform .3s}
/* kayfiyatlar */
.mood-idle .bz-body{animation:bzBob 2.8s ease-in-out infinite}
.mood-wave .bz-body{animation:bzBob 2.8s ease-in-out infinite}
.mood-wave .bz-arm.r{transform:rotate(-40deg);animation:bzWave .55s ease-in-out 4}
.mood-happy .bz-body{animation:bzJump .72s ease 2}
.mood-celebrate .bz-body{animation:bzSpin 1.15s cubic-bezier(.3,.7,.4,1) 1,bzBob 2.8s 1.15s ease-in-out infinite}
.mood-sad .bz-body{animation:bzDroop 2.4s ease-in-out infinite}
.mood-think .bz-body{animation:bzTilt 2.6s ease-in-out infinite}
.mood-sleep .bz-body{animation:bzBreath 3.4s ease-in-out infinite}
.mood-idle .m-smile,.mood-wave .m-open,.mood-happy .m-open,.mood-celebrate .m-open,.mood-sad .m-sad,.mood-think .m-o,.mood-sleep .m-o,.mood-surprised .m-o{display:inline}
.mood-happy .bz-eyes,.mood-celebrate .bz-eyes,.mood-sleep .bz-eyes{display:none}
.mood-happy .bz-sq,.mood-celebrate .bz-sq{display:inline}
.mood-sleep .bz-cl{display:inline}
.mood-think .bz-eyes{transform:translate(1.5px,-2.5px)}
.mood-sad .bz-eyes{transform:translateY(1.5px)}
.mood-sleep .x-z,.mood-sad .x-tear,.mood-happy .x-spark,.mood-celebrate .x-spark,.mood-think .x-sweat,.mood-wave .x-hi{display:inline}
.mood-happy .bz-arm.l,.mood-celebrate .bz-arm.l{transform:rotate(38deg)}
.mood-happy .bz-arm.r,.mood-celebrate .bz-arm.r{transform:rotate(-38deg)}
.mood-sad .bz-arm.l{transform:rotate(-34deg)}.mood-sad .bz-arm.r{transform:rotate(34deg)}
.mood-think .bz-arm.r{transform:rotate(-70deg)}
.x-z text{font:800 13px 'Nunito',sans-serif;fill:#93ABEB}
.x-z text{animation:bzZ 2.4s ease-in infinite}.x-z text:nth-child(2){animation-delay:.8s}.x-z text:nth-child(3){animation-delay:1.6s}
.x-tear path{fill:#7EC8F2;animation:bzTear 1.6s ease-in infinite;transform-box:fill-box}
.x-sweat path{fill:#7EC8F2;animation:bzTear 2.2s ease-in infinite;transform-box:fill-box}
.x-spark path{fill:#F5B83D;transform-box:fill-box;transform-origin:center;animation:bzSpark 1s ease-in-out infinite}
.x-spark path:nth-child(2){animation-delay:.33s;fill:#FF7A59}.x-spark path:nth-child(3){animation-delay:.66s}
.x-hi text{font:800 12px 'Nunito',sans-serif;fill:#FF7A59;animation:bzSpark 1.1s ease-in-out infinite}
@keyframes bzBob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3px) scale(1.012,.988)}}
@keyframes bzJump{0%{transform:translateY(0) scale(1,1)}15%{transform:translateY(2px) scale(1.12,.86)}42%{transform:translateY(-18px) scale(.94,1.08)}66%{transform:translateY(0) scale(1.08,.92)}82%{transform:translateY(-3px) scale(1,1)}100%{transform:translateY(0) scale(1,1)}}
@keyframes bzSpin{0%{transform:translateY(0) rotate(0)}12%{transform:translateY(3px) scale(1.12,.86)}35%{transform:translateY(-24px) rotate(180deg)}62%{transform:translateY(-24px) rotate(360deg)}82%{transform:translateY(0) scale(1.1,.9) rotate(360deg)}100%{transform:translateY(0) rotate(360deg)}}
@keyframes bzDroop{0%,100%{transform:translateY(2px) rotate(-3deg) scale(1.02,.97)}50%{transform:translateY(3px) rotate(3deg) scale(1.02,.97)}}
@keyframes bzTilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(-2deg)}}
@keyframes bzBreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.035,.965)}}
@keyframes bzWave{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(-62deg)}}
@keyframes bzBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes bzZ{0%{opacity:0;transform:translate(0,0)}25%{opacity:1}100%{opacity:0;transform:translate(9px,-20px)}}
@keyframes bzTear{0%{opacity:0;transform:translateY(-3px)}25%{opacity:1}100%{opacity:0;transform:translateY(12px)}}
@keyframes bzSpark{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}

/* Gapirish pufakchasi */
.bubble{position:relative;background:var(--paper);color:var(--ink);border-radius:18px;padding:12px 16px;box-shadow:var(--shadow);border:2px solid var(--cream-3);min-width:0}
.bubble .de{display:block;font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:18px;color:var(--navy);line-height:1.3}
.bubble small{display:block;color:var(--muted);font-size:14px;margin-top:3px;line-height:1.35}
.bubble .caret{display:inline-block;width:2px;height:1em;background:var(--coral);margin-left:2px;vertical-align:-2px;animation:caret .8s steps(1) infinite}
@keyframes caret{50%{opacity:0}}

/* Bosh sahifadagi yo'ldosh */
.buddy{display:flex;align-items:center;gap:14px;margin-top:18px}
.buddy .bubble{flex:1}
.buddy .bubble::before{content:'';position:absolute;left:-11px;top:50%;margin-top:-9px;border:9px solid transparent;border-right-color:var(--cream-3);border-left:0}
.buddy .bubble::after{content:'';position:absolute;left:-7px;top:50%;margin-top:-7px;border:7px solid transparent;border-right-color:var(--paper);border-left:0}
.buddy .bubble .b-act{margin-top:8px}

/* Testdagi Brezi */
.qcard{position:relative}
.qwrap .qcard{margin-top:38px}
.q-bz{position:absolute;right:10px;top:-34px;display:flex;align-items:flex-start;gap:4px;flex-direction:row-reverse;z-index:3;pointer-events:none}
.q-bz .bz{pointer-events:auto}
.q-say{background:var(--paper);border:2px solid var(--cream-3);border-radius:14px;padding:5px 10px;font-weight:800;font-size:14px;color:var(--navy);box-shadow:var(--shadow);margin-top:4px;white-space:nowrap;animation:celebIn .35s cubic-bezier(.2,1.4,.4,1)}
.q-say small{font-weight:600;color:var(--muted);font-size:12px;margin-left:4px}
.q-say.ok{border-color:var(--ok)}.q-say.bad{border-color:var(--bad)}
.combo{display:inline-flex;align-items:center;gap:3px;background:linear-gradient(90deg,#F5B83D,#FF9F5A);color:var(--on-c);font-weight:800;font-size:13px;padding:2px 10px;border-radius:999px;margin-left:8px;animation:celebIn .4s cubic-bezier(.2,1.6,.4,1)}
.qhead{align-items:center}
.res-bz{display:flex;flex-direction:column;align-items:center;gap:8px;margin:-6px auto 10px;max-width:360px}
.res-bz .bubble{text-align:center}
.path-bz{position:absolute;top:2px;z-index:2;pointer-events:none}
.path-bz .bz{pointer-events:auto}
.ob-bz{display:flex;flex-direction:column;align-items:center;gap:10px;margin:0 auto 14px}
.ob-bz .bubble{text-align:center;padding:8px 16px}
#splash .sp-bz{animation:celebIn .6s cubic-bezier(.2,1.4,.4,1) backwards}
#celeb .cbig .bz{margin:0 auto}

/* Jonli fon */
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.app{position:relative;z-index:1}
.bg-blob{position:absolute;border-radius:50%;opacity:.55;will-change:transform}
.bg-blob.a{width:520px;height:520px;left:-160px;top:-140px;background:radial-gradient(circle at 50% 50%,rgba(255,122,89,.20),rgba(255,122,89,0) 68%);animation:drift1 34s ease-in-out infinite alternate}

/* Hero: jonli bezaklar */

.hero .b2{animation:heroFloat 9s ease-in-out infinite}

.hero::before{content:'';position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 70%,rgba(255,255,255,.07) 80%,transparent 90%);animation:heroSweep 14s linear infinite;pointer-events:none}
.hs{position:absolute !important;color:#F5B83D;font-style:normal;pointer-events:none;animation:twinkle 3s ease-in-out infinite;text-shadow:0 0 12px rgba(245,184,61,.6)}
.hs.s1{right:34%;top:16%;font-size:14px}.hs.s2{right:12%;bottom:22%;font-size:18px;animation-delay:1s}.hs.s3{right:46%;bottom:14%;font-size:11px;animation-delay:2s}.hs.s4{right:26%;top:46%;font-size:9px;animation-delay:1.5s;color:#fff}

.hl-float.f1{right:8%;top:40%;font-size:46px}.hl-float.f2{right:30%;top:62%;font-size:30px;animation-delay:2s}.hl-float.f3{right:20%;top:8%;font-size:24px;animation-delay:4s}
@keyframes heroPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08) translate(-8px,6px)}}
@keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes heroSweep{to{transform:rotate(360deg)}}

function u100(n, fin){
  if(n===0) return '';
  if(n===1) return fin ? 'eins' : 'ein';
  if(n<20) return ONES[n];
  var t=Math.floor(n/10), u=n%10;
  if(u===0) return TENS[t];
  return (u===1?'ein':ONES[u])+'und'+TENS[t];
}
function u1000(n, fin){
  var h=Math.floor(n/100), r=n%100, s='';
  if(h>0) s += (h===1?'ein':ONES[h])+'hundert';
  if(r>0) s += u100(r, fin);
  return s;
}
function numDe(n){
  n = Math.floor(n);
  if(n===0) return 'null';
  if(n===1000000) return 'eine Million';
  var th=Math.floor(n/1000), r=n%1000, s='';
  if(th>0) s += u1000(th,false)+'tausend';
  if(r>0) s += u1000(r,true);
  return s;
}

    for(var i=0;i<c.w.length;i+=4){ var v=0; for(var b=0;b<4;b++){ if(state.learned[c.id+(i+b)]){ v|=(1<<b); any=true; } } hex+=v.toString(16); }

  });

}
function unpackLearned(o){
  var r={};

  return r;
}

      var all = [];
      try{ all = speechSynthesis.getVoices() || []; }catch(e){}
      self.deVoices = all.filter(function(v){ return /^de([-_]|$)/i.test(v.lang||''); });
      self.pick();
      var wasReady = self.ready; self.ready = true;
      if(current && current.view==='home' && (!wasReady || self.deVoices.length)) render();
    };
    try{ if(speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', load); else speechSynthesis.onvoiceschanged = load; }catch(e){ speechSynthesis.onvoiceschanged = load; }
    load(); setTimeout(load, 900); setTimeout(load, 2500);
  },
  pick: function(){
    var want = state.settings.voice, v=null, list=this.deVoices;
    if(want) v = list.filter(function(x){ return x.name===want; })[0];
    if(!v) v = list.filter(function(x){ return /de-DE/i.test(x.lang) && /google/i.test(x.name); })[0];
    if(!v) v = list.filter(function(x){ return /de-DE/i.test(x.lang); })[0];
    if(!v) v = list[0];
    this.voice = v || null;
  },
  /* qaysi ovoz manbai ishlatiladi: 'native' | 'browser' | 'google' */
  mode: function(){
    var e = state.settings.engine, ns = this.nativeStatus();
    if(e==='google') return 'google';
    if(ns===1 || ns===0) return 'native';
    if(this.ok && this.voice) return 'browser';
    if(e==='browser' && this.ok) return 'browser';
    return 'google';
  },
  useGoogle: function(){ return this.mode()==='google'; },
  /* faqat joriy ovozni to'xtatadi */
  _halt: function(){
    this.seq++;
    try{ if(this.ok) speechSynthesis.cancel(); }catch(e){}
    if(NATIVE){ try{ window.AndroidTTS.stop(); }catch(e){} }
    if(this.audio){ try{ this.audio.pause(); }catch(e){} this.audio=null; }
    document.querySelectorAll('.spk.playing').forEach(function(b){ b.classList.remove('playing'); });
  },
  /* hammasini (ketma-ketlikni ham) to'xtatadi */
  stop: function(){
    if(this.seqTok){ this.seqTok.stopped=true; this.seqTok=null; }
    this._halt();
  },
  _speak: function(text, opt){
    opt = opt||{};
    var self=this; this._halt(); var my=this.seq;
    var done = function(){ if(my!==self.seq) return; if(opt.btn) opt.btn.classList.remove('playing'); if(opt.onend) opt.onend(); };
    if(opt.btn) opt.btn.classList.add('playing');
    var m = this.mode();
    if(m==='google'){ this._google(text, opt.slow, done, my); return; }
    if(m==='native'){
      var id='u'+my;
      self._cbs[id]=done;
      try{ window.AndroidTTS.speak(String(text), opt.slow ? 0.6 : (+state.settings.rate||0.9), opt.pitch||1, id); }
      catch(e){ delete self._cbs[id]; done(); }
      return;
    }
    setTimeout(function(){
      if(my!==self.seq) return;
      try{
        var u = new SpeechSynthesisUtterance(text);
        u.lang = (self.voice && self.voice.lang) || 'de-DE';
        if(self.voice) u.voice = self.voice;
        if(opt.voice) u.voice = opt.voice;
        u.rate = opt.slow ? 0.55 : (+state.settings.rate||0.9);
        u.pitch = opt.pitch || 1;
        u.onend = done; u.onerror = done;
        self.cur = u; /* Chrome'da GC muammosiga qarshi */
        speechSynthesis.speak(u);
      }catch(e){ done(); }
    }, 60);
  },
  _google: function(text, slow, done, my){
    var self=this;
    var url = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=de&ttsspeed='+(slow?'0.35':'1')+'&q='+encodeURIComponent(String(text).slice(0,190));
    var a = new Audio(url);
    this.audio = a;
    a.onended = done;
    a.onerror = function(){ if(my!==self.seq) return; toast("Ovoz yuklanmadi. Internetni yoki ⚙️ sozlamalarni tekshiring."); done(); };
    try{ if(!slow) a.playbackRate = Math.max(0.6, Math.min(1.2, (+state.settings.rate||0.9)+0.1)); }catch(e){}
    var p = a.play(); if(p && p.catch) p.catch(function(){ done(); });
  },
  speakOne: function(text, opt){ this.stop(); this._speak(text, opt); },
  /* ketma-ket o'qish (dialog, mavzu, alifbo) */
  sequence: function(items, onEach, onDone){
    var self=this; this.stop();
    var tok={stopped:false}; this.seqTok=tok; var i=0;
    var second = this.deVoices.filter(function(v){ return self.voice && v.name!==self.voice.name && /de-DE/i.test(v.lang); })[0];
    var next = function(){
      if(tok.stopped) return;
      if(i>=items.length){ if(self.seqTok===tok) self.seqTok=null; onEach(-1); if(onDone) onDone(); return; }
      var it=items[i]; onEach(i); i++;
      var o={onend:function(){ if(!tok.stopped) setTimeout(next, 450); }};
      if(it.b){ if(second && self.mode()==='browser') o.voice=second; else o.pitch=0.78; }
      self._speak(it.text, o);
    };
    next();
  }
};

function confetti(){
  var cols=['#FF7A59','#14213D','#F4E9D6','#B8893F','#FF9D91'];
  for(var i=0;i<46;i++){
    var c=document.createElement('div'); c.className='confetti';

function pickDistractors(correct, pool, key, n){
  var seen={}; seen[correct[key]]=1; var out=[];
  var p = shuffle(pool);
  for(var i=0;i<p.length && out.length<n;i++){ var v=p[i][key]; if(!seen[v]){ seen[v]=1; out.push(v); } }
  if(out.length<n){
    var p2 = shuffle(ALLW);
    for(var j=0;j<p2.length && out.length<n;j++){ var v2=p2[j][key]; if(!seen[v2]){ seen[v2]=1; out.push(v2); } }
  }
  return out;
}

function breakdown(n){
  var parts=[];
  var th=Math.floor(n/1000), r=n%1000;
  function sub(x, fin){
    var out=[]; var h=Math.floor(x/100), rr=x%100;
    if(h>0) out.push({t:(h===1?'ein':ONES[h])+'hundert', u:h+'×100'});
    if(rr>0){
      if(rr<20) out.push({t:(rr===1&&!fin)?'ein':ONES[rr], u:String(rr)});
      else { var t=Math.floor(rr/10), u=rr%10; if(u>0){ out.push({t:u===1?'ein':ONES[u], u:String(u), p:1}); out.push({t:'und',u:'va'}); } out.push({t:TENS[t], u:String(t*10), p:u>0?1:0}); }
    }
    return out;
  }
  if(th>0){ parts = parts.concat(sub(th,false)); parts.push({t:'tausend',u:'×1000'}); }
  if(r>0) parts = parts.concat(sub(r,true));
  return parts;
}

var SFX = {
  ctx:null,
  get: function(){
    if(!this.ctx){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; try{ this.ctx=new C(); }catch(e){ return null; } }
    try{ if(this.ctx.state==='suspended') this.ctx.resume(); }catch(e){}
    return this.ctx;
  },
  tone: function(f, t0, dur, type, vol){
    var c=this.ctx, now=c.currentTime+t0;
    var o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f, now);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(vol||0.15, now+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, now+dur);
    o.connect(g); g.connect(c.destination); o.start(now); o.stop(now+dur+0.05);
  },
  play: function(kind){
    if(state.settings.sfx===false) return;
    var c=this.get(); if(!c) return;
    var self=this;
    try{
      if(kind==='ok'){ self.tone(659,0,.12,'sine',.16); self.tone(988,.09,.24,'sine',.16); }
      else if(kind==='bad'){ self.tone(233,0,.16,'triangle',.2); self.tone(174,.12,.3,'triangle',.18); }
      else if(kind==='tap'){ self.tone(880,0,.06,'sine',.05); }
      else if(kind==='win'){ [523,659,784,1047].forEach(function(f,i){ self.tone(f,i*.1,.32,'sine',.14); }); }
      else if(kind==='level'){ [392,523,659,784,1047,1319].forEach(function(f,i){ self.tone(f,i*.08,.38,'triangle',.12); }); }
      else if(kind==='ach'){ self.tone(784,0,.16,'sine',.14); self.tone(1175,.13,.45,'sine',.14); }
      else if(kind==='unlock'){ [440,554,659,880].forEach(function(f,i){ self.tone(f,i*.07,.28,'sine',.13); }); }
    }catch(e){}
  }
};

function gainXp(n, fromEl){
  n = Math.round(nz(n)); if(n<=0){ saveState(); return; }
  touchDay();
  var lvBefore = levelOf(state.xp);
  state.xp += n;
  var k = dayKey(), dBefore = nz(state.days[k]);
  state.days[k] = dBefore + n;
  var h = new Date().getHours();
  if(h>=23 || h<4) state.flags.night = 1;
  if(h>=4 && h<7) state.flags.early = 1;
  if(state.streak > nz(state.bestStreak)) state.bestStreak = state.streak;
  floatXp(n, fromEl);
  var goal = nz(state.goal)||50;
  if(dBefore < goal && state.days[k] >= goal){ state.goalDays = nz(state.goalDays)+1; goalReached(); }
  var lv = levelOf(state.xp); if(lv > lvBefore) levelUp(lv);
  saveState(); checkAch();
}

function qWord(w, mode, pool){
  pool = pool || ALLW.filter(function(x){ return x.cat===w.cat; });
  if(mode==='art' && wordArt(w) && !w.pl){
    return {type:'art', ask:"Artiklini tanlang", prompt:wordBare(w), sub:w.uz, options:['der','die','das'], answer:wordArt(w), say:w.de, reveal:w.de, mean:w.uz, wid:w.id};
  }

  if(mode==='audio') return {type:'audio', ask:"Eshiting va ma'nosini toping", options:shuffle([w.uz].concat(pickDistractors(w,pool,'uz',3))), answer:w.uz, say:w.de, autoSay:true, reveal:w.de+'  ['+w.tr+']', mean:w.uz, wid:w.id};
  return {type:'de2uz', ask:"Tarjimasini toping", prompt:w.de, sub:'['+w.tr+']', options:shuffle([w.uz].concat(pickDistractors(w,pool,'uz',3))), answer:w.uz, say:w.de, autoSay:true, mean:w.uz, wid:w.id};
}
function qPhrase(it, pool, rev){
  var key = rev ? 'de' : 'uz', seen={}, opts=[];
  seen[it[key]]=1;
  for(var i=0;i<pool.length && opts.length<3;i++){ var v=pool[i][key]; if(v && !seen[v]){ seen[v]=1; opts.push(v); } }
  if(rev) return {type:'uz2de', ask:"Nemischasini toping", prompt:it.uz, options:shuffle([it.de].concat(opts)), answer:it.de, say:it.de, mean:it.uz};
  return {type:'de2uz', ask:"Tarjimasini toping", prompt:it.de, sub:it.tr?'['+it.tr+']':'', options:shuffle([it.uz].concat(opts)), answer:it.uz, say:it.de, autoSay:true, mean:it.uz};
}
var NUM_RANGES = [[0,20],[21,100],[100,1000]];
function qNumber(range, listen){
  range = range || NUM_RANGES[rnd(0,NUM_RANGES.length-1)];
  var n=rnd(range[0],range[1]), set={}, opts=[n]; set[n]=1;
  var s=String(n);
  if(s.length===2 && s[0]!==s[1]){ var rv=parseInt(s[1]+s[0],10); if(!set[rv]){ set[rv]=1; opts.push(rv); } }
  var t=0; while(opts.length<4 && t<200){ t++; var c = Math.random()<.5 ? n+rnd(-12,12) : rnd(range[0],range[1]); if(c>=0 && !set[c]){ set[c]=1; opts.push(c); } }
  opts = shuffle(opts).map(String);
  var w=numDe(n);
  if(listen) return {type:'num', ask:"Eshiting va sonni toping", audio:true, say:w, autoSay:true, options:opts, answer:String(n), reveal:w, mean:String(n)};
  return {type:'num', ask:"Bu qaysi son?", prompt:w, options:opts, answer:String(n), say:w, mean:String(n)};
}
var SOUND_WORDS = (function(){
  var seen={}, out=[];
  ALPHABET.forEach(function(a){ if(!seen[a[3]]){ seen[a[3]]=1; out.push(a[3]); } });
  SOUNDS.forEach(function(s){ s.ex.forEach(function(e){ if(!seen[e[0]]){ seen[e[0]]=1; out.push(e[0]); } }); });

function qSound(word){
  var others = shuffle(SOUND_WORDS.filter(function(x){ return x!==word; }));
  /* o'xshash uzunlikdagi so'zlarni afzal ko'ramiz — qiyinroq va foydaliroq */
  others.sort(function(a,b){ return Math.abs(a.length-word.length)-Math.abs(b.length-word.length); });
  var opts = [word].concat(others.slice(0,3));
  return {type:'sound', ask:"Qaysi so'zni eshitdingiz?", audio:true, say:word, autoSay:true, options:shuffle(opts), answer:word, optDe:true, mean:''};
}

function buildSoundQuiz(n){ return shuffle(SOUND_WORDS).slice(0, n||10).map(qSound); }

  var lines=dialogLines(ids), all=dialogLines(null);

function buildLessonQuiz(id){
  var l=LESSONS.filter(function(x){ return x.id===id; })[0], others=allPhrases();
  return shuffle(l.items).slice(0, 8).map(function(it, k){
    return qPhrase(it, shuffle(l.items.filter(function(x){ return x!==it; })).concat(shuffle(others)), k%2===1);
  });
}
function buildExam(spec, n){
  var kinds=[];
  (spec.lessons||[]).forEach(function(id){ kinds.push(['L',id]); });
  (spec.cats||[]).forEach(function(id){ kinds.push(['C',id]); });
  if(spec.numbers){ kinds.push(['N']); kinds.push(['N']); }
  (spec.dialogs||[]).length && kinds.push(['D']);
  if(spec.sound) kinds.push(['S']);
  var out=[], used={}, tries=0, k=shuffle(kinds), i=0;
  while(out.length<n && tries<n*12){
    tries++;
    var kind=k[i%k.length]; i++;
    var q=null;
    if(kind[0]==='L'){ var l=LESSONS.filter(function(x){ return x.id===kind[1]; })[0]; var it=l.items[rnd(0,l.items.length-1)]; q=qPhrase(it, shuffle(l.items.filter(function(x){ return x!==it; })).concat(shuffle(allPhrases())), Math.random()<.5); }
    else if(kind[0]==='C'){ var pool=ALLW.filter(function(w){ return w.cat===kind[1]; }); var w=pool[rnd(0,pool.length-1)]; q=qWord(w, ['de2uz','uz2de','audio','art'][rnd(0,3)], pool); }
    else if(kind[0]==='N'){ q=qNumber(null, Math.random()<.5); }
    else if(kind[0]==='D'){ var ls=dialogLines(spec.dialogs), ln=ls[rnd(0,ls.length-1)]; q=qPhrase(ln, shuffle(ls.filter(function(x){ return x!==ln; })).concat(shuffle(dialogLines(null))), Math.random()<.5); }
    else if(kind[0]==='S'){ q=qSound(SOUND_WORDS[rnd(0,SOUND_WORDS.length-1)]); }
    if(!q) continue;
    var key=q.say+'|'+q.answer;
    if(used[key]) continue;
    used[key]=1; out.push(q);
  }
  return shuffle(out);
}

  var pool = TCFG.cat==='all' ? ALLW : ALLW.filter(function(w){ return w.cat===TCFG.cat; });
  if(TCFG.mode==='art'){
    pool = pool.filter(function(w){ return wordArt(w) && !w.pl; });
    if(pool.length<4) pool = ALLW.filter(function(w){ return wordArt(w) && !w.pl; });
  }
  return shuffle(pool).slice(0, Math.min(TCFG.n, pool.length)).map(function(w){ return qWord(w, TCFG.mode, TCFG.cat==='all'?null:pool); });
}

      QZ.msgOk = nx ? '🔓 Yangi bosqich ochildi: «'+nx.title+'»' : '🎉 Barcha bosqichlar tugatildi!';

function applyPlacement(){
  var per=[0,0,0];
  QZ.qs.forEach(function(q, i){ if(QZ.res[i]) per[q.unit]++; });
  var opened=0;
  for(var u=0; u<3; u++){
    if(per[u]>=4){ UNITS[u].nodes.forEach(function(n){ state.path[n.id]=Math.max(80, nz(state.path[n.id])); if(n.type==='lesson') state.lessons[n.id]=Math.max(80, nz(state.lessons[n.id])); }); opened++; }
    else break;
  }
  QZ.msgOk = opened ? '🎯 Natija: '+opened+' ta bo\'lim sizga tanish ekan — ular avtomatik ochildi. '+(opened<3?'Endi '+(opened+1)+'-bo\'limdan davom etasiz.':'Endi A1 yakuniy imtihoniga tayyorsiz!') : '🌱 Noldan boshlash eng to\'g\'ri yo\'l — 1-bo\'limdan boshlaymiz!';
  return 20;
}

  });

  h += '</div><div class="fb '+(QZ.answered?(ok?'ok':'bad'):'')+'">'+(QZ.answered?(ok?'✓ Barakalla! +10 XP':'✗ Noto\'g\'ri. To\'g\'ri javob: '+esc(q.answer)):'')+

AFTER.quiz = function(){
  if(!QZ) return;

  if(!QZ.answered && !QZ.spoken){
    var q=QZ.qs[QZ.i]; QZ.spoken=true;
    if(q.autoSay){ var qz0=QZ, i0=QZ.i; setTimeout(function(){ if(QZ===qz0 && QZ.i===i0 && current.view==='quiz') say(q.say); }, 300); }
  }
};
function quizPick(el){
  if(!QZ || QZ.answered) return;
  var q=QZ.qs[QZ.i], o=q.options[parseInt(el.dataset.p,10)];
  var ok = o===q.answer;
  QZ.picked=o; QZ.answered=true; QZ.anim=false;
  QZ.res = QZ.res || []; QZ.res[QZ.i] = ok;
  state.answered = nz(state.answered)+1;
  if(ok){
    QZ.score++; state.correct = nz(state.correct)+1;
    if(q.wid){ state.learned[q.wid]=1; if(state.wrong[q.wid]){ state.wrong[q.wid]--; if(state.wrong[q.wid]<=0) delete state.wrong[q.wid]; } }
    SFX.play('ok');
  } else {
    QZ.wrong.push(q);
    if(q.wid) state.wrong[q.wid] = nz(state.wrong[q.wid])+1;
    SFX.play('bad');
  }
  if(q.wid && WMAP[q.wid]){ var c=WMAP[q.wid].cat, cs=state.cat[c]||[0,0]; cs[1]++; if(ok) cs[0]++; state.cat[c]=cs; }
  render();
  if(ok) gainXp(10, document.querySelector('.opt.right')); else saveState();
  if(q.type!=='de2uz' || !ok) say(q.say);
}
function quizNext(){
  QZ.i++; QZ.answered=false; QZ.picked=null; QZ.spoken=false; QZ.anim=true;
  if(QZ.i>=QZ.qs.length){
    QZ.done=true;
    var pct=Math.round(QZ.score/QZ.qs.length*100); QZ.pct=pct;
    state.quizzes = nz(state.quizzes)+1;
    if(pct===100) state.perfect = nz(state.perfect)+1;
    var bonus = QZ.opts.onDone ? (QZ.opts.onDone(pct)||0) : 0;
    QZ.bonus = bonus;
    if(bonus) gainXp(bonus); else { saveState(); checkAch(); }
    if(pct >= (QZ.opts.pass||70)){ setTimeout(function(){ confetti(); SFX.play('win'); }, 350); }
  }
  render(); window.scrollTo(0,0);
}

    '<h2 class="serif" style="color:var(--navy)">'+msg+'</h2><p class="muted">'+QZ.score+' / '+QZ.qs.length+' to\'g\'ri · +'+xp+' XP</p>'+

  h += '<button class="btn btn-o" data-act="go" data-v="'+QZ.back[0]+'"'+(QZ.back[2]?' data-p="'+esc(QZ.back[2])+'"':'')+'>'+esc(QZ.back[1])+'</button></div>';
  if(QZ.wrong.length){
    h += '<div class="review"><b style="color:var(--navy)">Xatolar ustida ishlash:</b>'+QZ.wrong.map(function(q){ return '<div class="r">'+spk(q.say,'sm')+'<div><b>'+(q.type==='num'?esc(q.say):artHtml(q.say))+'</b> <span class="muted">'+(q.mean?'— '+esc(q.mean):'')+'</span></div></div>'; }).join('')+'</div>';
  }
  return h+'</div>';

function animateResult(){
  var ring=document.getElementById('resRing'), t=document.getElementById('resPct'); if(!ring||!t) return;
  var target=QZ.pct, t0=null, dur=REDUCED?1:900;
  var step=function(ts){
    if(!t0) t0=ts; var p=Math.min(1,(ts-t0)/dur), e=1-Math.pow(1-p,3), v=Math.round(target*e);
    ring.style.background='conic-gradient(var(--coral) '+(v*3.6)+'deg, var(--cream-2) 0)'; t.textContent=v+'%';
    if(p<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function memFlip(k){
  if(G.lock || G.open.indexOf(k)>-1) return;

  document.getElementById('mc'+k).classList.add('open');

/* Scramble */
function scrSetup(){
  var w=G.list[G.i]; var word=wordBare(w);
  var letters=word.split('');
  var mix; var t=0;
  do { mix=shuffle(letters.map(function(ch,i){ return {ch:ch, i:i}; })); t++; } while(mix.map(function(x){return x.ch;}).join('')===word && t<20);
  G.word=word; G.w=w; G.tiles=mix; G.used={}; G.ans=[]; G.status=''; G.hints=0;
}
GAME_VIEW.scramble = function(){
  if(G.i>=G.list.length){
    var isNew=setBest('scramble',G.score); if(!G.xpGiven){ G.xpGiven=1; addXp(G.score*8); if(isNew&&G.score>0) confetti(); }
    return gameOverHtml("O'yin tugadi!", G.score+' / '+G.list.length, G.score*8, isNew);
  }
  var w=G.w, a=wordArt(w);
  var h='<div class="qwrap"><div class="qhead"><span>'+(G.i+1)+' / '+G.list.length+'</span><span>✓ '+G.score+'</span></div><div class="pbar"><i style="width:'+(G.i/G.list.length*100)+'%"></i></div>'+
    '<div class="qcard"><div class="ask">Harflardan so\'z tuzing</div><div class="prompt" style="font-size:28px">'+esc(w.uz)+'</div>'+(a?'<div class="sub">Artikli: <span class="art '+a+'">'+a+'</span></div>':'')+
    '<div class="mt">'+spk(w.de,'sm')+' <span class="muted" style="font-size:13px">ovozli yordam</span></div>'+
    '<div class="slots '+G.status+'">'+G.ans.map(function(ti, k){ return '<button class="lt" data-act="scrBack" data-p="'+k+'">'+esc(G.tiles[ti].ch)+'</button>'; }).join('')+'</div>'+
    '<div class="pool">'+G.tiles.map(function(t,k){ return '<button class="lt '+(G.used[k]?'used':'')+'" data-act="scrPick" data-p="'+k+'">'+esc(t.ch)+'</button>'; }).join('')+'</div>'+
    '<div class="fb '+(G.status==='ok'?'ok':(G.status==='bad'?'bad':''))+'">'+(G.status==='ok'?'✓ To\'g\'ri! '+artHtml(w.de):(G.status==='bad'?'✗ Yana urinib ko\'ring':''))+'</div>'+
    '<div class="toolbar mt" style="justify-content:center">'+(G.status==='ok'?'<button class="btn btn-n" data-act="scrNext">Keyingi →</button>':'<button class="btn btn-o btn-s" data-act="scrClear">↺ Tozalash</button><button class="btn btn-o btn-s" data-act="scrHint">💡 Yordam</button><button class="btn btn-o btn-s" data-act="scrSkip">O\'tkazib yuborish →</button>')+'</div></div></div>';
  return h;
};
function scrCheck(){
  if(G.ans.length!==G.tiles.length) return;
  var s=G.ans.map(function(ti){ return G.tiles[ti].ch; }).join('');
  if(s===G.word){ G.status='ok'; if(G.hints<2){ G.score++; } state.learned[G.w.id]=1; saveState(); say(G.w.de); }
  else G.status='bad';
}
function scrHint(){
  /* to'g'ri prefiksni qoldirib, keyingi to'g'ri harfni qo'yadi */
  var cur=G.ans.map(function(ti){ return G.tiles[ti].ch; }).join('');
  var k=0; while(k<G.ans.length && cur[k]===G.word[k]) k++;
  var keep=G.ans.slice(0,k); G.used={}; keep.forEach(function(ti){ G.used[ti]=1; }); G.ans=keep;
  if(k>=G.word.length) return;
  var need=G.word[k];
  for(var i=0;i<G.tiles.length;i++){ if(!G.used[i] && G.tiles[i].ch===need){ G.used[i]=1; G.ans.push(i); break; } }
  G.hints++; G.status=''; scrCheck();
}

  var toks=p.de.replace(/[.!?]+$/,'').split(' ').map(function(t){ return t.replace(/,$/,''); });

  do { mix=shuffle(toks.map(function(x,i){ return {t:x, i:i}; })); t++; } while(mix.map(function(x){return x.t;}).join(' ')===toks.join(' ') && t<20);
  G.p=p; G.toks=toks; G.tiles=mix; G.used={}; G.ans=[]; G.status='';
}
