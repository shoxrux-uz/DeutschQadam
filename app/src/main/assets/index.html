/* =====================================================================
   TALAFFUZNI TEKSHIRISH (mikrofon + nutqni tanish)
   Android ilovada — telefonning nutqni tanish xizmati (AndroidTTS.listen),
   brauzerda — Web Speech API (agar mavjud bo'lsa).
   ===================================================================== */
function levDist(a, b){
  var m=a.length, n=b.length; if(!m) return n; if(!n) return m;
  var prev=[], cur=[], i, j;
  for(j=0;j<=n;j++) prev[j]=j;
  for(i=1;i<=m;i++){
    cur=[i];
    for(j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));
    prev=cur;
  }
  return prev[n];
}
function strSim(a, b){ if(!a && !b) return 1; return 1 - levDist(a,b)/Math.max(a.length,b.length); }
/* Solishtirish uchun matnni tekislash: kichik harf, umlaut → ae/oe/ue, raqamlar → nemischa so'z */
function normPron(s){
  s = String(s||'').toLowerCase().replace(/\d+/g, function(d){ var n=parseInt(d,10); return (n>=0 && n<=1000000) ? numDe(n).toLowerCase() : d; });
  return norm(s).replace(/[-–—'’`´()\[\]]/g,' ').replace(/\s+/g,' ').trim();
}
/* target — namuna, alts — tanish tizimi bergan variantlar. Natija: ball (0–100), eshitilgan matn, so'zlar bo'yicha belgilar */
function scorePron(target, alts){
  var tokens = String(target||'').split(/\s+/).filter(Boolean);
  var tnorm = tokens.map(normPron);
  var full = tnorm.join('');
  var best = {score:0, heard:'', marks:tokens.map(function(){ return false; })};
  (alts||[]).forEach(function(alt){
    var h = normPron(alt), hw = h.split(' ').filter(Boolean);
    var real=0, ok=0;
    var marks = tnorm.map(function(w){
      if(!w) return true;
      real++;
      var hit = hw.some(function(x){ return x===w || (w.length>2 && strSim(x,w)>=0.75); });
      if(hit) ok++;
      return hit;
    });
    var ws = real ? ok/real : 0;
    var cs = strSim(full, h.replace(/ /g,''));
    var sc = Math.round(Math.max(ws, cs)*100);
    if(sc>best.score || !best.heard) best = {score:sc, heard:alt, marks:marks};
  });
  return best;
}

var PRON = {
  seq: 0, cur: null, timer: null,
  nativeOk: function(){ try{ return !!(NATIVE && typeof window.AndroidTTS.listen==='function' && window.AndroidTTS.sttAvailable()); }catch(e){ return false; } },
  webCtor: function(){ return window.SpeechRecognition || window.webkitSpeechRecognition || null; },
  supported: function(){ return this.nativeOk() || !!this.webCtor(); },
  start: function(cb){
    var self=this; this.stop(true);
    var id='p'+(++this.seq);
    this.cur = {id:id, cb:cb};
    TTS.stop();
    clearTimeout(this.timer);
    this.timer = setTimeout(function(){ if(self.cur && self.cur.id===id){ self.finishErr(id, 6); } }, 15000);
    if(this.nativeOk()){
      try{ window.AndroidTTS.listen(id); }catch(e){ this.finishErr(id, 5); }
      return;
    }
    var C=this.webCtor();
    if(!C){ this.finishErr(id, 100); return; }
    try{
      var r=new C(); this.web=r;
      r.lang='de-DE'; r.maxAlternatives=5; r.interimResults=false; r.continuous=false;
      r.onstart=function(){ window.__sttState(id,'ready'); };
      r.onspeechstart=function(){ window.__sttState(id,'speech'); };
      r.onresult=function(e){
        var res=e.results[0], texts=[], conf=[];
        for(var i=0;i<res.length;i++){ texts.push(res[i].transcript); conf.push(res[i].confidence); }
        window.__sttResult(id, texts, conf);
      };
      r.onerror=function(e){
        var m={'not-allowed':9,'service-not-allowed':9,'no-speech':6,'network':2,'audio-capture':3,'language-not-supported':12,'aborted':-1};
        window.__sttError(id, m[e.error]!=null ? m[e.error] : 5);
      };
      r.onend=function(){ setTimeout(function(){ if(self.cur && self.cur.id===id) self.finishErr(id, 7); }, 400); };
      r.start();
    }catch(e){ this.finishErr(id, 5); }
  },
  stop: function(silent){
    if(this.web){ try{ this.web.abort(); }catch(e){} this.web=null; }
    if(NATIVE && typeof window.AndroidTTS.stopListening==='function'){ try{ window.AndroidTTS.stopListening(); }catch(e){} }
    if(!silent && this.cur){ var c=this.cur; this.cur=null; c.cb({type:'cancel'}); }
    this.cur=null; clearTimeout(this.timer);
  },
  finishErr: function(id, code){
    if(!this.cur || this.cur.id!==id) return;
    var c=this.cur; this.cur=null; clearTimeout(this.timer);
    if(this.web){ try{ this.web.abort(); }catch(e){} this.web=null; }
    c.cb({type:'error', code:code});
  }
};
window.__sttState = function(id, st){ if(PRON.cur && PRON.cur.id===id) PRON.cur.cb({type:'state', state:st}); };
window.__sttLevel = function(v){
  var m=document.querySelector('.mic.listen'); if(!m) return;
  var k=Math.max(0, Math.min(1, (v+2)/12));
  m.style.setProperty('--lv', (1+k*0.18).toFixed(2));
};
window.__sttResult = function(id, texts, conf){
  if(!PRON.cur || PRON.cur.id!==id) return;
  var c=PRON.cur; PRON.cur=null; clearTimeout(PRON.timer);
  c.cb({type:'result', texts:texts||[], conf:conf||[]});
};
window.__sttError = function(id, code){ if(code===-1) return; PRON.finishErr(id, code); };

function sttErrText(code){
  if(code===9) return "🎤 Mikrofon ruxsati berilmadi. Tugmani yana bosing va «Разрешить» ni tanlang.";
  if(code===99) return "🎤 Mikrofon ruxsati o'chirilgan. Ilova sozlamalaridan «Микрофон» ruxsatini yoqing.";
  if(code===6 || code===7) return "🤔 Ovoz eshitilmadi yoki tushunilmadi. Telefonni yaqinroq tuting va aniqroq ayting.";
  if(code===1 || code===2 || code===4) return "📶 Internet bilan muammo. Nutqni tanish uchun internet kerak bo'lishi mumkin.";
  if(code===3) return "🎤 Mikrofonga ulanib bo'lmadi. Boshqa ilova mikrofonni band qilmaganini tekshiring.";
  if(code===8) return "⏳ Tanish tizimi band. Bir soniyadan keyin qayta urinib ko'ring.";
  if(code===12 || code===13) return "🌐 Telefonda nemis tilini tanish paketi yo'q. Google ilovasini yangilab ko'ring.";
  if(code===100) return "Bu qurilmada nutqni tanish xizmati topilmadi. Android ilovada «Google» ilovasi o'rnatilgan bo'lishi kerak.";
  return "Nimadir xato ketdi. Yana bir bor urinib ko'ring.";
}

function pronRefresh(){

function pronListen(){
  if(!PR) return;
  if(PR.st==='listen' || PR.st==='proc'){ PRON.stop(true); PR.st='idle'; pronRefresh(); return; }
  if(!PRON.supported()){ PR.err=100; pronRefresh(); return; }
  PR.st='listen'; PR.err=null; pronRefresh();
  var item=PR.item, pr=PR;
  PRON.start(function(ev){
    if(PR!==pr) return;
    if(ev.type==='state'){ if(ev.state==='end'){ PR.st='proc'; pronRefresh(); } return; }
    if(ev.type==='cancel'){ PR.st='idle'; pronRefresh(); return; }
    if(ev.type==='error'){ PR.st='idle'; PR.err=ev.code; SFX.play('bad'); pronRefresh(); return; }
    var r=scorePron(item.de, ev.texts);
    PR.st='idle'; PR.err=null;
    if(!PR.res || r.score>=PR.res.score || PR.mode==='modal') PR.res=r;
    PR.last=r;
    state.pronTries = nz(state.pronTries)+1;
    if(r.score>=85){ state.pronOk = nz(state.pronOk)+1; }
    SFX.play(r.score>=60?'ok':'bad');
    pronRefresh();
    if(r.score>=85 && PR.mode==='modal') gainXp(5, document.querySelector('.pron-res')); else saveState();
    checkAch();
  });
}

function pronItems(){
  var ph = allPhrases().filter(function(p){ var n=p.de.split(/\s+/).length; return n>=2 && n<=5 && p.de.indexOf('/')<0; });

  var a = shuffle(ph).slice(0,6).map(function(p){ return {de:p.de, tr:p.tr, uz:p.uz}; });
  var b = shuffle(ws).slice(0,4).map(function(w){ return {de:w.de, tr:w.tr, uz:w.uz, wid:w.id}; });
  return shuffle(a.concat(b));
}

function stripHint(s){ return String(s).replace(/\s*\([^)]*\)\s*$/,'').trim(); }
function orderTokens(de){ return String(de).replace(/[.!?]+$/,'').split(/\s+/).map(function(t){ return t.replace(/,$/,''); }).filter(Boolean); }
function qGram(d, gid, mcOnly){
  if(d.t==='mc'){
    var ans=d.o[d.a];
    return {type:'gram', ask:"Bo'sh joyni to'ldiring", prompt:d.q, sub:d.uz||'', options:shuffle(d.o.slice()), answer:ans, say:stripHint(d.q.replace('___', ans)), mean:d.uz||'', gid:gid};
  }
  if(mcOnly) return null;
  if(d.t==='type'){
    var arrow = d.q.indexOf('→')>-1 && d.q.indexOf('___')>d.q.indexOf('→');
    var full = d.q.split('→').pop().replace(/^[^:]*:\s*/, function(m){ return /Partizip|Präteritum|Komparativ/.test(m)?'':m; });
    return {type:'gtype', kind:'type', ask:"To'g'ri shaklini yozing", prompt:d.q, answer:d.a[0], accept:d.a, say:stripHint(arrow ? full.replace('___', d.a[0]) : d.q.replace('___', d.a[0])), mean:'', gid:gid};
  }
  return {type:'gorder', kind:'order', ask:"So'zlardan nemischa gap tuzing", prompt:d.uz, tokens:orderTokens(d.de), answer:d.de, say:d.de, mean:d.uz, gid:gid};
}
function buildGrammarQuiz(gid, n){
  var g=GRAM_MAP[gid];
  var mc=g.drill.filter(function(d){ return d.t==='mc'; }), other=g.drill.filter(function(d){ return d.t!=='mc'; });
  var pick = shuffle(mc).slice(0, Math.max(5, (n||10)-Math.min(other.length,4))).concat(shuffle(other).slice(0, Math.min(other.length,4)));
  return shuffle(pick).slice(0, n||10).map(function(d){ return qGram(d, gid); });
}
function buildCatQuiz(cat, n){
  var pool=ALLW.filter(function(w){ return w.cat===cat; });
  var modes=['de2uz','uz2de','audio','art'];
  return shuffle(pool).slice(0, Math.min(n||12, pool.length)).map(function(w,i){
    var m=modes[i%4]; if(m==='art' && (!wordArt(w)||w.pl)) m='de2uz';
    return qWord(w, m, pool);
  });
}

var _buildExamA1 = buildExam;
buildExam = function(spec, n){
  if(!spec.gram || !spec.gram.length) return _buildExamA1(spec, n);
  var out=[], used={}, tries=0;
  var gramN = Math.round(n*0.5);
  var gl = spec.gram.slice(), i=0;
  while(out.length<gramN && tries<n*20){
    tries++;
    var g=GRAM_MAP[gl[i%gl.length]]; i++;
    var mcs=g.drill.filter(function(d){ return d.t==='mc'; });
    var q=qGram(mcs[rnd(0,mcs.length-1)], g.id, true);
    var key=q.say+'|'+q.answer; if(used[key]) continue; used[key]=1; out.push(q);
  }
  var rest = (spec.cats&&spec.cats.length) ? _buildExamA1({cats:spec.cats, lessons:spec.lessons, numbers:spec.numbers, dialogs:spec.dialogs, sound:spec.sound}, n-out.length) : [];
  rest.forEach(function(q){ var key=q.say+'|'+q.answer; if(!used[key]){ used[key]=1; out.push(q); } });
  /* yetmasa — grammatikadan to'ldiramiz */
  tries=0;
  while(out.length<n && tries<200){
    tries++;
    var g2=GRAM_MAP[spec.gram[rnd(0,spec.gram.length-1)]], m2=g2.drill.filter(function(d){ return d.t==='mc'; });
    var q2=qGram(m2[rnd(0,m2.length-1)], g2.id, true), k2=q2.say+'|'+q2.answer;
    if(!used[k2]){ used[k2]=1; out.push(q2); }
  }
  return shuffle(out).slice(0,n);
};

function quizMark(ok, picked, el){
  var q=QZ.qs[QZ.i];
  QZ.picked=picked; QZ.answered=true; QZ.anim=false; QZ.lastOk=ok;
  QZ.res = QZ.res || []; QZ.res[QZ.i] = ok;
  state.answered = nz(state.answered)+1;
  if(ok){
    QZ.score++; state.correct = nz(state.correct)+1;
    if(q.wid){ state.learned[q.wid]=1; if(state.wrong[q.wid]){ state.wrong[q.wid]--; if(state.wrong[q.wid]<=0) delete state.wrong[q.wid]; } }
    SFX.play('ok');
  } else {
    QZ.wrong.push(q);
    if(q.wid) state.wrong[q.wid] = nz(state.wrong[q.wid])+1;
    SFX.play('bad');
  }
  if(q.wid && WMAP[q.wid]){ var c=WMAP[q.wid].cat, cs=state.cat[c]||[0,0]; cs[1]++; if(ok) cs[0]++; state.cat[c]=cs; }
  if(q.gid){ var gs=state.cat['g:'+q.gid]||[0,0]; gs[1]++; if(ok) gs[0]++; state.cat['g:'+q.gid]=gs; }
  render();
  if(ok) gainXp(10, document.querySelector('.opt.right, .slots.ok, .qtype.ok')); else saveState();
  if(q.type!=='de2uz' || !ok) say(q.say);
}
quizPick = function(el){
  if(!QZ || QZ.answered) return;
  var q=QZ.qs[QZ.i], o=q.options[parseInt(el.dataset.p,10)];
  quizMark(o===q.answer, o, el);
};
function quizTypeCheck(){
  if(!QZ || QZ.answered) return;
  var q=QZ.qs[QZ.i], inp=document.getElementById('qIn'); if(!inp) return;
  var v=inp.value.trim();
  if(!v){ toast("Javobni yozing"); inp.focus(); return; }
  var ok=(q.accept||[q.answer]).some(function(a){ return norm(a)===norm(v); });
  quizMark(ok, v);
}
function ordState(){ if(!QZ.ord || QZ.ord.i!==QZ.i){ var q=QZ.qs[QZ.i], t=q.tokens.map(function(x,k){ return {t:x,k:k}; }), mix, tries=0; do { mix=shuffle(t); tries++; } while(tries<20 && mix.map(function(x){ return x.t; }).join(' ')===q.tokens.join(' ')); QZ.ord={i:QZ.i, tiles:mix, used:{}, ans:[]}; } return QZ.ord; }
function ordCheck(){
  var o=ordState(), q=QZ.qs[QZ.i];

  var s=o.ans.map(function(ti){ return o.tiles[ti].t; }).join(' ');

}

/* Zarrachalar */
function burst(x, y, n){
  if(REDUCED || document.documentElement.classList.contains('rm')) return;
  var cols=['#FF7A59','#F5B83D','#22A06B','#2B4583','#FFC2A8'];
  for(var i=0;i<(n||16);i++){
    var p=document.createElement('i'); p.className='ptc';
    var a=Math.random()*Math.PI*2, d=40+Math.random()*60;
    p.style.left=x+'px'; p.style.top=y+'px'; p.style.background=cols[i%cols.length];
    p.style.setProperty('--dx', Math.cos(a)*d+'px'); p.style.setProperty('--dy', Math.sin(a)*d-20+'px');
    if(i%3===0) p.style.borderRadius='50%';
    document.body.appendChild(p);
    (function(el){ setTimeout(function(){ el.remove(); }, 800); })(p);
  }
}
function burstAt(el){ if(!el||!el.getBoundingClientRect) return; var r=el.getBoundingClientRect(); burst(r.left+r.width/2, r.top+r.height/2); }

  for(var i=0;i<12;i++){

}

function notifOn(){ return state.settings.notif!==false; }

}

}
function updRefresh(){
  var b=document.getElementById('updBox'); if(b) b.innerHTML=updSettingsHtml();
  if(current && current.view==='home'){
    var c=document.querySelector('.upd-card'), html=updCardHtml();
    if(c && !html) c.remove();
    else if(!c && html){ var m=document.getElementById('main'); if(m) m.insertAdjacentHTML('afterbegin', html); }
  }
}
window.__updInfo = function(info, manual){
  try{ UPD = (typeof info==='string') ? JSON.parse(info) : info; }catch(e){ return; }
  if(manual) toast(updNew() ? "🆕 Yangi versiya bor: v1."+UPD.latest : (UPD.latest ? "✓ Sizda eng so'nggi versiya" : "Internetga ulanib bo'lmadi — keyinroq urinib ko'ring"));
  updRefresh();
};
ACT.updCheck = function(){ if(!updCan()) return; toast("Tekshirilmoqda…"); try{ window.AndroidTTS.updateCheck(); }catch(e){} };
ACT.updNotify = function(el){
  var on=el.dataset.p==='on'; try{ window.AndroidTTS.updateNotify(on); }catch(e){}
  if(UPD) UPD.on=on;
  document.querySelectorAll('[data-act="updNotify"]').forEach(function(b){ b.classList.toggle('on', b.dataset.p===el.dataset.p); });
};
var _homeViewUpd = VIEWS.home;
VIEWS.home = function(){ return updCardHtml() + _homeViewUpd.apply(this, arguments); };
if(updCan()){ try{ UPD = JSON.parse(window.AndroidTTS.updateInfo()); }catch(e){} }

function clearActive(){ document.querySelectorAll('.phr.active,.bub.active').forEach(function(e){ e.classList.remove('active'); }); }
document.addEventListener('click', function(e){
  var t=e.target.closest('[data-act]'); if(!t) return;
  var a=ACT[t.dataset.act]; if(a){ e.preventDefault(); a(t, e); }
});
document.getElementById('modal').addEventListener('click', function(e){ if(e.target.id==='modal' && !modalLocked) closeModal(); });
document.getElementById('celeb').addEventListener('click', function(e){ if(e.target.id==='celeb') e.currentTarget.classList.remove('show'); });

var _local = loadLocal();
applyTheme();
render();
TTS.init();
startQuotes();
try{ if(window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ if(!state.settings.theme) applyTheme(); }); }catch(e){}
setTimeout(function(){ bootStep('splash'); }, (window.__TEST__ || REDUCED) ? 0 : 1300);
loadRemote(_local, function(changed){
  if(changed){ applyTheme(); render(); } else renderXp();
  bootStep('data');
});
