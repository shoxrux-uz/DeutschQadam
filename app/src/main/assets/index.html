<!DOCTYPE html>
<html lang="uz">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutsch Qadam — Nemis tili</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14213D; --navy-2:#1E3160; --navy-3:#2B4583; --navy-soft:#E4E8F2;
  --cream:#FBF4E8; --cream-2:#F4E9D6; --cream-3:#EADBC1; --paper:#FFFCF6;
  --coral:#FF6B5B; --coral-d:#E2503F; --coral-soft:#FFE3DE;
  --sand:#B8893F; --sand-soft:#F5E6C8;
  --ink:#14213D; --muted:#6A7186; --ok:#2F8F6B; --ok-soft:#DDF2E8; --bad:#D9443A; --bad-soft:#FBE1DE;
  --r:18px; --shadow:0 6px 24px rgba(20,33,61,.08); --shadow-2:0 10px 34px rgba(20,33,61,.16);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--cream);color:var(--ink);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-.01em;margin:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select{font-family:inherit;font-size:16px}
.app{display:flex;min-height:100vh}

/* ---------- Sidebar ---------- */
.side{width:250px;flex:0 0 250px;background:var(--navy);color:var(--cream);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px;overflow-y:auto;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px}
.brand-logo{width:42px;height:42px;border-radius:13px;background:var(--coral);display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:800;font-size:20px;color:#fff;box-shadow:0 6px 18px rgba(255,107,91,.4)}
.brand b{font-family:'Fraunces',serif;font-size:20px;display:block;line-height:1.1}
.brand small{color:#AEB8D3;font-size:12px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:#D4DBEC;font-weight:700;font-size:15px;text-align:left;transition:.15s}
.nav button .ic{width:26px;text-align:center;font-size:18px}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:var(--coral);color:#fff;box-shadow:0 6px 16px rgba(255,107,91,.35)}
.side-foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid rgba(255,255,255,.08)}
.xpbox{background:var(--navy-2);border-radius:14px;padding:12px 14px;font-size:13px;color:#C7CFE3}
.xpbox b{color:#fff;font-size:18px;font-family:'Fraunces',serif}
.setbtn{margin-top:10px;width:100%;padding:10px;border-radius:12px;background:rgba(255,255,255,.06);color:#D4DBEC;font-weight:700;font-size:14px}
.setbtn:hover{background:rgba(255,255,255,.12)}

/* ---------- Topbar (mobile) ---------- */
.top{display:none;position:sticky;top:0;z-index:30;background:var(--navy);color:var(--cream);padding:10px 14px;align-items:center;gap:10px}
.top .brand{padding:0}
.top .brand-logo{width:36px;height:36px;font-size:17px}
.burger{margin-left:auto;width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.08);font-size:20px;color:#fff}
.scrim{display:none;position:fixed;inset:0;background:rgba(20,33,61,.45);z-index:35}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;padding:30px 38px 90px;max-width:1180px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-h h1{font-size:34px;color:var(--navy)}
.page-h p{margin:6px 0 0;color:var(--muted);max-width:620px}
.crumb{font-size:13px;font-weight:800;color:var(--coral);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--navy-3);padding:6px 0;margin-bottom:6px}
.back:hover{color:var(--coral)}

.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;border:1px solid rgba(20,33,61,.05)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mt{margin-top:18px}.mt2{margin-top:28px}
.muted{color:var(--muted)}
.sec-t{font-size:22px;color:var(--navy);margin:30px 0 14px;display:flex;align-items:center;gap:10px}
.sec-t:first-child{margin-top:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;font-weight:800;font-size:15px;transition:.15s;white-space:nowrap}
.btn-c{background:var(--coral);color:#fff;box-shadow:0 6px 16px rgba(255,107,91,.32)}
.btn-c:hover{background:var(--coral-d);transform:translateY(-1px)}
.btn-n{background:var(--navy);color:var(--cream)}
.btn-n:hover{background:var(--navy-2)}
.btn-o{background:transparent;border:2px solid var(--cream-3);color:var(--navy)}
.btn-o:hover{border-color:var(--navy);}
.btn-s{padding:8px 14px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* Speaker buttons */
.spk{width:40px;height:40px;flex:0 0 40px;border-radius:50%;background:var(--coral);color:#fff;display:inline-grid;place-items:center;box-shadow:0 4px 12px rgba(255,107,91,.35);transition:.15s}
.spk:hover{transform:scale(1.08);background:var(--coral-d)}
.spk svg{width:19px;height:19px}
.spk.sm{width:32px;height:32px;flex-basis:32px}.spk.sm svg{width:15px;height:15px}
.spk.slow{background:var(--navy-soft);color:var(--navy);box-shadow:none;font-size:15px}
.spk.slow:hover{background:var(--cream-3)}
.spk.big{width:86px;height:86px;flex-basis:86px}.spk.big svg{width:38px;height:38px}
.spk.playing{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,107,91,.55)}70%{box-shadow:0 0 0 14px rgba(255,107,91,0)}100%{box-shadow:0 0 0 0 rgba(255,107,91,0)}}

/* Hero */
.hero{background:var(--navy);color:var(--cream);border-radius:26px;padding:34px;position:relative;overflow:hidden}
.hero h1{font-size:40px;color:#fff}
.hero p{color:#C7CFE3;max-width:520px;margin:10px 0 22px;font-size:17px}
.hero .blob{position:absolute;border-radius:50%}
.hero .b1{width:260px;height:260px;background:var(--coral);right:-70px;top:-90px;opacity:.9}
.hero .b2{width:150px;height:150px;background:var(--cream);right:120px;bottom:-80px;opacity:.12}
.hero .b3{width:70px;height:70px;background:var(--sand);right:70px;bottom:40px;opacity:.55}
.hero > *{position:relative}
.hero-flag{display:inline-flex;gap:0;border-radius:6px;overflow:hidden;margin-bottom:12px}
.hero-flag i{width:26px;height:6px;display:block}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.08);border-radius:14px;padding:10px 16px;min-width:110px}
.stat b{display:block;font-family:'Fraunces',serif;font-size:24px;color:#fff}
.stat span{font-size:13px;color:#AEB8D3}

.potd{display:flex;align-items:center;gap:16px}
.potd .de{font-family:'Fraunces',serif;font-size:24px;color:var(--navy);font-weight:700}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--coral-soft);color:var(--coral-d);text-transform:uppercase;letter-spacing:.05em}
.tag.n{background:var(--navy-soft);color:var(--navy-3)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}

/* path */
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.step{background:var(--paper);border-radius:16px;padding:16px;text-align:left;box-shadow:var(--shadow);border:2px solid transparent;transition:.15s;display:flex;flex-direction:column;gap:6px}
.step:hover{border-color:var(--coral);transform:translateY(-2px)}
.step .num{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.step.done .num{background:var(--ok)}
.step b{font-size:16px}
.step small{color:var(--muted)}

.tile{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;text-align:left;transition:.18s;border:2px solid transparent;display:flex;flex-direction:column;gap:6px;position:relative}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-2);border-color:var(--cream-3)}
.tile .emo{font-size:30px;width:56px;height:56px;border-radius:16px;background:var(--cream-2);display:grid;place-items:center;margin-bottom:6px}
.tile b{font-size:17px;color:var(--navy)}
.tile small{color:var(--muted);font-size:14px}
.tile .done-badge{position:absolute;top:14px;right:14px}
.tile.navy{background:var(--navy);color:var(--cream)}
.tile.navy b{color:#fff}.tile.navy small{color:#AEB8D3}.tile.navy .emo{background:rgba(255,255,255,.08)}
.tile.coral{background:var(--coral);color:#fff}
.tile.coral b{color:#fff}.tile.coral small{color:#FFE7E3}.tile.coral .emo{background:rgba(255,255,255,.18)}

/* Phrase rows */
.phr{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:var(--paper);box-shadow:0 2px 10px rgba(20,33,61,.05);transition:.15s;border:2px solid transparent}
.phr + .phr{margin-top:10px}
.phr.active{border-color:var(--coral);background:#FFF6F3}
.phr .txt{flex:1;min-width:0}
.phr .de{font-weight:800;font-size:18px;color:var(--navy)}
.phr .tr{font-size:14px;color:var(--coral-d);font-style:italic;font-weight:700}
.phr .uz{font-size:15px;color:var(--muted)}
.phr .acts{display:flex;gap:8px}
.tip{background:var(--sand-soft);border-left:5px solid var(--sand);border-radius:14px;padding:14px 18px;color:#5B4418;font-size:15px}
.tip b{color:#3F2E0D}
.tip.n{background:var(--navy-soft);border-color:var(--navy-3);color:var(--navy)}
.tip.c{background:var(--coral-soft);border-color:var(--coral);color:#7A2A20}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Alphabet */
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.let{background:var(--paper);border-radius:16px;padding:14px 10px 12px;text-align:center;box-shadow:0 2px 10px rgba(20,33,61,.05);border:2px solid transparent;transition:.15s;position:relative}
.let:hover{border-color:var(--coral)}
.let .L{font-family:'Fraunces',serif;font-size:34px;font-weight:800;color:var(--navy);line-height:1}
.let .L small{font-size:22px;color:var(--muted);margin-left:2px}
.let .nm{font-size:13px;color:var(--coral-d);font-weight:800;margin-top:4px}
.let .ex{font-size:13px;color:var(--muted);margin-top:2px}
.let.special{background:var(--navy);}
.let.special .L{color:#fff}.let.special .ex{color:#AEB8D3}.let.special .nm{color:#FF9D91}

.snd{display:flex;gap:16px;align-items:flex-start}
.snd .combo{min-width:78px;height:64px;border-radius:16px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:'Fraunces',serif;font-size:26px;font-weight:800;padding:0 10px}
.snd .info{flex:1;min-width:0}
.snd .say{font-weight:800;color:var(--coral-d)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:var(--cream-2);font-weight:700;font-size:14px;color:var(--navy);transition:.15s}
.chip:hover{background:var(--coral);color:#fff}
.chip .mini{font-size:12px;opacity:.75;font-weight:600}
.chip.on{background:var(--navy);color:#fff}

/* Dialog */
.dlg{display:flex;flex-direction:column;gap:12px}
.bub{max-width:78%;padding:12px 16px;border-radius:18px;box-shadow:0 2px 10px rgba(20,33,61,.06);display:flex;gap:10px;align-items:flex-start;border:2px solid transparent}
.bub.a{background:var(--paper);align-self:flex-start;border-bottom-left-radius:5px}
.bub.b{background:var(--navy);color:var(--cream);align-self:flex-end;border-bottom-right-radius:5px}
.bub.active{border-color:var(--coral)}
.bub .who{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--coral)}
.bub .de{font-weight:800;font-size:17px}
.bub.a .de{color:var(--navy)}
.bub .uz{font-size:14px;opacity:.75}
.hide-uz .bub .uz{display:none}

/* Numbers */
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.nbox{background:var(--paper);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(20,33,61,.05);text-align:left;border:2px solid transparent;transition:.15s}
.nbox:hover{border-color:var(--coral)}
.nbox .n{font-family:'Fraunces',serif;font-size:26px;font-weight:800;color:var(--coral);min-width:44px}
.nbox .w{font-weight:800;color:var(--navy);font-size:15px;line-height:1.2}
.nbox .t{font-size:12px;color:var(--muted)}
.tabs{display:inline-flex;background:var(--cream-2);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.tabs button{padding:9px 16px;border-radius:11px;font-weight:800;color:var(--navy);font-size:14px}
.tabs button.on{background:var(--navy);color:#fff}
.inp{width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--cream-3);background:#fff;color:var(--navy);font-weight:700;font-size:18px;outline:none;transition:.15s}
.inp:focus{border-color:var(--coral)}
.conv-out{font-family:'Fraunces',serif;font-size:28px;font-weight:700;color:var(--navy);word-break:break-word}
.breakdown{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.breakdown span{background:var(--cream-2);padding:5px 10px;border-radius:9px;font-weight:700;font-size:14px}
.breakdown span.p{background:var(--coral-soft);color:var(--coral-d)}

/* Vocab */
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.vw{background:var(--paper);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(20,33,61,.05);border-left:5px solid var(--cream-3)}
.vw.der{border-left-color:var(--navy-3)}.vw.die{border-left-color:var(--coral)}.vw.das{border-left-color:var(--sand)}
.vw .txt{flex:1;min-width:0}
.vw .de{font-weight:800;color:var(--navy);font-size:16px}
.vw .tr{font-size:13px;color:var(--coral-d);font-style:italic;font-weight:700}
.vw .uz{font-size:14px;color:var(--muted)}
.vw .chk{font-size:14px;color:var(--ok);font-weight:800}
.art{font-weight:800}
.art.der{color:var(--navy-3)}.art.die{color:var(--coral-d)}.art.das{color:var(--sand)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;font-weight:700}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}

/* flashcard */
.fc-wrap{perspective:1200px;max-width:520px;margin:0 auto}
.fc{position:relative;height:300px;transform-style:preserve-3d;transition:transform .55s;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;box-shadow:var(--shadow-2)}
.fc .front{background:var(--navy);color:#fff}
.fc .back{background:var(--paper);transform:rotateY(180deg);color:var(--navy)}
.fc .big{font-family:'Fraunces',serif;font-size:36px;font-weight:800;line-height:1.15}
.fc .hint{font-size:13px;opacity:.6;margin-top:14px}
.fc .tr{color:var(--coral);font-style:italic;font-weight:700;margin-top:8px}
.fc-ctrl{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}

/* Quiz */
.qwrap{max-width:720px;margin:0 auto}
.pbar{height:10px;background:var(--cream-2);border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),#FF8F7F);border-radius:999px;transition:width .3s}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800;color:var(--muted);font-size:14px}
.qcard{background:var(--paper);border-radius:24px;box-shadow:var(--shadow-2);padding:30px;text-align:center;margin-top:16px}
.qcard .ask{font-size:14px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.qcard .prompt{font-family:'Fraunces',serif;font-size:34px;font-weight:800;color:var(--navy);margin:14px 0 6px;line-height:1.2;word-break:break-word}
.qcard .sub{color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.opt{padding:16px;border-radius:16px;background:var(--cream);border:2px solid var(--cream-3);font-weight:800;color:var(--navy);font-size:16px;transition:.15s;text-align:center;min-height:62px}
.opt:hover:not(:disabled){border-color:var(--navy);background:#fff}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:18px;font-weight:800;min-height:26px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.result{text-align:center}
.result .score{font-family:'Fraunces',serif;font-size:64px;font-weight:800;color:var(--coral);line-height:1}
.ring{width:150px;height:150px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center}
.ring > div{width:118px;height:118px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:'Fraunces',serif;font-size:34px;font-weight:800;color:var(--navy)}
.review{text-align:left;margin-top:20px}
.review .r{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bad-soft);margin-top:8px}
.review .r b{color:var(--navy)}

.cfg label{font-weight:800;color:var(--navy);display:block;margin-bottom:8px}
.cfg .row{margin-bottom:20px}
.sel{appearance:none;-webkit-appearance:none;width:100%;padding:12px 14px;border-radius:13px;border:2px solid var(--cream-3);background:#fff;color:var(--navy);font-weight:700;outline:none}
.sel:focus{border-color:var(--coral)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.mode{padding:14px;border-radius:16px;border:2px solid var(--cream-3);background:#fff;text-align:left;transition:.15s}
.mode b{display:block;color:var(--navy)}
.mode small{color:var(--muted);font-size:13px}
.mode.on{border-color:var(--coral);background:#FFF6F3;box-shadow:0 0 0 3px var(--coral-soft)}
.mode .e{font-size:22px}

/* Games */
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pill{background:var(--navy);color:#fff;border-radius:999px;padding:7px 14px;font-weight:800;font-size:14px}
.pill.c{background:var(--coral)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:720px;margin:0 auto}
.mc{aspect-ratio:1/.8;perspective:800px}
.mc .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s}
.mc.open .in,.mc.got .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;padding:8px;text-align:center}
.mc .f{background:var(--navy);color:var(--coral);font-family:'Fraunces',serif;font-size:30px;font-weight:800;box-shadow:var(--shadow)}
.mc .f::after{content:'?'}
.mc .b{background:var(--paper);transform:rotateY(180deg);font-weight:800;color:var(--navy);font-size:15px;box-shadow:var(--shadow);border:2px solid var(--cream-3);word-break:break-word}
.mc .b.de{color:var(--coral-d)}
.mc.got .b{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}

.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;min-height:62px;padding:12px;border-radius:16px;background:var(--cream);border:2px dashed var(--cream-3);margin-top:18px}
.slots.ok{border-color:var(--ok);background:var(--ok-soft)}
.slots.bad{border-color:var(--bad);background:var(--bad-soft)}
.pool{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.lt{min-width:46px;height:50px;padding:0 14px;border-radius:13px;background:var(--navy);color:#fff;font-weight:800;font-size:20px;box-shadow:0 4px 0 #0B1428;transition:.1s}
.lt:active{transform:translateY(3px);box-shadow:0 1px 0 #0B1428}
.lt.w{font-size:17px}
.lt.used{visibility:hidden}
.slots .lt{background:var(--coral);box-shadow:0 4px 0 var(--coral-d)}
.umls{display:flex;gap:8px;justify-content:center;margin-top:10px}
.umls button{width:46px;height:42px;border-radius:11px;background:var(--cream-2);font-weight:800;font-size:18px;color:var(--navy)}
.umls button:hover{background:var(--coral);color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.tf button{padding:20px;border-radius:18px;font-weight:800;font-size:18px;color:#fff}
.tf .y{background:var(--ok)}.tf .n{background:var(--bad)}
.timer{font-family:'Fraunces',serif;font-size:40px;font-weight:800;color:var(--coral)}

/* Grammar */
.gtbl{width:100%;border-collapse:separate;border-spacing:0;margin-top:10px;overflow:hidden;border-radius:14px}
.gtbl th{background:var(--navy);color:#fff;text-align:left;padding:10px 14px;font-size:14px}
.gtbl td{padding:10px 14px;border-bottom:1px solid var(--cream-2);background:#fff}
.gtbl tr:last-child td{border-bottom:none}
.gtbl td.de{font-weight:800;color:var(--navy)}
.gtbl td .spk{vertical-align:middle}
.ex-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.ex-row .de{font-weight:800;color:var(--navy)}
.ex-row .uz{color:var(--muted);font-size:14px}

/* misc */
.search{position:relative;max-width:360px;flex:1}
.search input{padding-left:42px}
.search::before{content:'🔎';position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px}
.voice-warn{display:flex;gap:12px;align-items:center}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;box-shadow:var(--shadow-2);opacity:0;transition:.25s;z-index:100;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-bg{position:fixed;inset:0;background:rgba(20,33,61,.5);z-index:90;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--paper);border-radius:24px;padding:26px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-2)}
.modal h2{color:var(--navy);font-size:24px;margin-bottom:16px}
.range{width:100%;accent-color:var(--coral)}
.made{position:fixed;right:16px;bottom:14px;z-index:80;background:var(--navy);color:var(--cream);padding:8px 14px 8px 12px;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:.02em;box-shadow:0 6px 18px rgba(20,33,61,.28);display:flex;align-items:center;gap:8px;pointer-events:none;user-select:none}
.made i{width:8px;height:8px;border-radius:50%;background:var(--coral);display:block;box-shadow:0 0 0 3px rgba(255,107,91,.25)}
.made b{color:var(--coral)}
.empty{text-align:center;padding:30px;color:var(--muted)}
.confetti{position:fixed;top:-10px;width:10px;height:14px;z-index:95;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

var ONES = ["null","eins","zwei","drei","vier","fünf","sechs","sieben","acht","neun","zehn","elf","zwölf","dreizehn","vierzehn","fünfzehn","sechzehn","siebzehn","achtzehn","neunzehn"];
var TENS = ["","","zwanzig","dreißig","vierzig","fünfzig","sechzig","siebzig","achtzig","neunzig"];
var ONES_TR = ["nul","ayns","tsvay","dray","fiir","fünf","zeks","ziiben","axt","noyn","tseen","elf","tsvölf","draytseen","fiirtseen","fünftseen","zextseen","ziiptseen","axtseen","noyntseen"];
var TENS_TR = {20:"tsvantsix",30:"draysix",40:"fiirtsix",50:"fünftsix",60:"zextsix",70:"ziiptsix",80:"axtsix",90:"noyntsix",100:"hundert",1000:"tauzent"};

function u100(n, fin){
  if(n===0) return '';
  if(n===1) return fin ? 'eins' : 'ein';
  if(n<20) return ONES[n];
  var t=Math.floor(n/10), u=n%10;
  if(u===0) return TENS[t];
  return (u===1?'ein':ONES[u])+'und'+TENS[t];
}
function u1000(n, fin){
  var h=Math.floor(n/100), r=n%100, s='';
  if(h>0) s += (h===1?'ein':ONES[h])+'hundert';
  if(r>0) s += u100(r, fin);
  return s;
}
function numDe(n){
  n = Math.floor(n);
  if(n===0) return 'null';
  if(n===1000000) return 'eine Million';
  var th=Math.floor(n/1000), r=n%1000, s='';
  if(th>0) s += u1000(th,false)+'tausend';
  if(r>0) s += u1000(r,true);
  return s;
}

var LS_KEY = 'deutschQadam_v1';
var state = {xp:0, streak:0, lastDay:'', learned:{}, lessons:{}, best:{}, settings:{engine:'auto', rate:0.9, voice:''}, ts:0};
var HAS_GAS = (typeof google!=='undefined' && google.script && google.script.run);
var saveTimer = null;

function applyState(o){
  if(!o || typeof o!=='object') return;
  state.xp = +o.xp||0; state.streak=+o.streak||0; state.lastDay=o.lastDay||'';
  state.learned = o.lp ? unpackLearned(o.lp) : (o.learned||{}); state.lessons=o.lessons||{}; state.best=o.best||{};
  state.settings = Object.assign({engine:'auto', rate:0.9, voice:''}, o.settings||{});
  state.ts = +o.ts||0;
}
/* O'rganilgan so'zlarni ixcham saqlash (har bo'lim uchun bit-maska, hex) */
function packLearned(){
  var o={};
  VOCAB.forEach(function(c){
    var hex='', any=false;
    for(var i=0;i<c.w.length;i+=4){ var v=0; for(var b=0;b<4;b++){ if(state.learned[c.id+(i+b)]){ v|=(1<<b); any=true; } } hex+=v.toString(16); }
    if(any) o[c.id]=hex.replace(/0+$/,'');
  });
  return o;
}
function unpackLearned(o){
  var r={};
  for(var cat in o){ var hex=String(o[cat]||''); for(var j=0;j<hex.length;j++){ var v=parseInt(hex[j],16)||0; for(var b=0;b<4;b++){ if(v&(1<<b)) r[cat+(j*4+b)]=1; } } }
  return r;
}
function loadState(cb){
  var local=null;
  try{ local = JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){}
  if(local) applyState(local);
  if(HAS_GAS){
    try{
      google.script.run.withSuccessHandler(function(s){
        if(s){ try{ var srv=JSON.parse(s); if(!local || (+srv.ts||0) > (+local.ts||0)){ applyState(srv); cb(true); return; } }catch(e){} }
        cb(false);
      }).withFailureHandler(function(){ cb(false); }).getProgress();
    }catch(e){ cb(false); }
  } else cb(false);
}
function saveState(){
  state.ts = Date.now();
  var o = {}; for(var k in state) if(k!=='learned') o[k]=state[k];
  o.lp = packLearned();
  var j = JSON.stringify(o);
  try{ localStorage.setItem(LS_KEY, j); }catch(e){}
  if(HAS_GAS){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ try{ google.script.run.saveProgress(j); }catch(e){} }, 1200);
  }
  renderXp();
}
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function touchDay(){
  var t=todayStr();
  if(state.lastDay===t) return;
  var y=new Date(); y.setDate(y.getDate()-1);
  var ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
  state.streak = (state.lastDay===ys) ? state.streak+1 : 1;
  state.lastDay=t;
}
function addXp(n){ touchDay(); state.xp += n; saveState(); }
function learnedCount(){ var c=0; for(var k in state.learned) if(state.learned[k]) c++; return c; }
function lessonsDone(){ var c=0; LESSONS.forEach(function(l){ if(state.lessons[l.id]) c++; }); return c; }

/* Android ilova ichida ishlayotgan bo'lsa — telefonning o'z ovoz tizimi (AndroidTTS ko'prigi) */
var NATIVE = (typeof window.AndroidTTS !== 'undefined' && window.AndroidTTS);
var TTS = {
  ok: ('speechSynthesis' in window) && typeof SpeechSynthesisUtterance!=='undefined',
  deVoices: [], voice: null, cur: null, audio: null, seq: 0, seqTok: null, ready:false, _cbs:{},
  /* 0 — tayyorlanmoqda, 1 — nemischa ovoz bor, 2 — nemischa ovoz o'rnatilmagan, 3 — ovoz tizimi yo'q, -1 — Android emas */
  nativeStatus: function(){ if(!NATIVE) return -1; try{ return +window.AndroidTTS.status(); }catch(e){ return 3; } },
  init: function(){
    var self=this;
    if(NATIVE){
      var tries=0, last=-2;
      var poll=function(){
        var st=self.nativeStatus(); tries++;
        if(st!==last){ last=st; if(current && current.view==='home') render(); }
        if(st===0 && tries<40) setTimeout(poll, 400);
      };
      poll();
    }
    if(!this.ok){ this.ready=true; if(current && current.view==='home') render(); return; }
    var load=function(){
      var all = [];
      try{ all = speechSynthesis.getVoices() || []; }catch(e){}
      self.deVoices = all.filter(function(v){ return /^de([-_]|$)/i.test(v.lang||''); });
      self.pick();
      var wasReady = self.ready; self.ready = true;
      if(current && current.view==='home' && (!wasReady || self.deVoices.length)) render();
    };
    try{ if(speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', load); else speechSynthesis.onvoiceschanged = load; }catch(e){ speechSynthesis.onvoiceschanged = load; }
    load(); setTimeout(load, 900); setTimeout(load, 2500);
  },
  pick: function(){
    var want = state.settings.voice, v=null, list=this.deVoices;
    if(want) v = list.filter(function(x){ return x.name===want; })[0];
    if(!v) v = list.filter(function(x){ return /de-DE/i.test(x.lang) && /google/i.test(x.name); })[0];
    if(!v) v = list.filter(function(x){ return /de-DE/i.test(x.lang); })[0];
    if(!v) v = list[0];
    this.voice = v || null;
  },
  /* qaysi ovoz manbai ishlatiladi: 'native' | 'browser' | 'google' */
  mode: function(){
    var e = state.settings.engine, ns = this.nativeStatus();
    if(e==='google') return 'google';
    if(ns===1 || ns===0) return 'native';
    if(this.ok && this.voice) return 'browser';
    if(e==='browser' && this.ok) return 'browser';
    return 'google';
  },
  useGoogle: function(){ return this.mode()==='google'; },
  /* faqat joriy ovozni to'xtatadi */
  _halt: function(){
    this.seq++;
    try{ if(this.ok) speechSynthesis.cancel(); }catch(e){}
    if(NATIVE){ try{ window.AndroidTTS.stop(); }catch(e){} }
    if(this.audio){ try{ this.audio.pause(); }catch(e){} this.audio=null; }
    document.querySelectorAll('.spk.playing').forEach(function(b){ b.classList.remove('playing'); });
  },
  /* hammasini (ketma-ketlikni ham) to'xtatadi */
  stop: function(){
    if(this.seqTok){ this.seqTok.stopped=true; this.seqTok=null; }
    this._halt();
  },
  _speak: function(text, opt){
    opt = opt||{};
    var self=this; this._halt(); var my=this.seq;
    var done = function(){ if(my!==self.seq) return; if(opt.btn) opt.btn.classList.remove('playing'); if(opt.onend) opt.onend(); };
    if(opt.btn) opt.btn.classList.add('playing');
    var m = this.mode();
    if(m==='google'){ this._google(text, opt.slow, done, my); return; }
    if(m==='native'){
      var id='u'+my;
      self._cbs[id]=done;
      try{ window.AndroidTTS.speak(String(text), opt.slow ? 0.6 : (+state.settings.rate||0.9), opt.pitch||1, id); }
      catch(e){ delete self._cbs[id]; done(); }
      return;
    }
    setTimeout(function(){
      if(my!==self.seq) return;
      try{
        var u = new SpeechSynthesisUtterance(text);
        u.lang = (self.voice && self.voice.lang) || 'de-DE';
        if(self.voice) u.voice = self.voice;
        if(opt.voice) u.voice = opt.voice;
        u.rate = opt.slow ? 0.55 : (+state.settings.rate||0.9);
        u.pitch = opt.pitch || 1;
        u.onend = done; u.onerror = done;
        self.cur = u; /* Chrome'da GC muammosiga qarshi */
        speechSynthesis.speak(u);
      }catch(e){ done(); }
    }, 60);
  },
  _google: function(text, slow, done, my){
    var self=this;
    var url = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=de&ttsspeed='+(slow?'0.35':'1')+'&q='+encodeURIComponent(String(text).slice(0,190));
    var a = new Audio(url);
    this.audio = a;
    a.onended = done;
    a.onerror = function(){ if(my!==self.seq) return; toast("Ovoz yuklanmadi. Internetni yoki ⚙️ sozlamalarni tekshiring."); done(); };
    try{ if(!slow) a.playbackRate = Math.max(0.6, Math.min(1.2, (+state.settings.rate||0.9)+0.1)); }catch(e){}
    var p = a.play(); if(p && p.catch) p.catch(function(){ done(); });
  },
  speakOne: function(text, opt){ this.stop(); this._speak(text, opt); },
  /* ketma-ket o'qish (dialog, mavzu, alifbo) */
  sequence: function(items, onEach, onDone){
    var self=this; this.stop();
    var tok={stopped:false}; this.seqTok=tok; var i=0;
    var second = this.deVoices.filter(function(v){ return self.voice && v.name!==self.voice.name && /de-DE/i.test(v.lang); })[0];
    var next = function(){
      if(tok.stopped) return;
      if(i>=items.length){ if(self.seqTok===tok) self.seqTok=null; onEach(-1); if(onDone) onDone(); return; }
      var it=items[i]; onEach(i); i++;
      var o={onend:function(){ if(!tok.stopped) setTimeout(next, 450); }};
      if(it.b){ if(second && self.mode()==='browser') o.voice=second; else o.pitch=0.78; }
      self._speak(it.text, o);
    };
    next();
  }
};

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function rnd(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function norm(s){ return String(s||'').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[.,!?;:¿¡"«»]/g,'').replace(/\s+/g,' ').trim(); }
var SPK_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M16.5 12a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/><path d="M14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z" opacity=".7"/></svg>';
function spk(text, cls){ return '<button class="spk '+(cls||'')+'" data-act="say" data-say="'+esc(text)+'" title="Tinglash">'+SPK_SVG+'</button>'; }
function spkSlow(text, cls){ return '<button class="spk slow '+(cls||'')+'" data-act="sayslow" data-say="'+esc(text)+'" title="Sekin tinglash">🐢</button>'; }
function artHtml(de){
  var m=/^(der|die|das) (.*)$/.exec(de);
  return m ? '<span class="art '+m[1]+'">'+m[1]+'</span> '+esc(m[2]) : esc(de);
}
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('show'); }, 2600); }
function confetti(){
  var cols=['#FF6B5B','#14213D','#F4E9D6','#B8893F','#FF9D91'];
  for(var i=0;i<46;i++){
    var c=document.createElement('div'); c.className='confetti';
    c.style.left=Math.random()*100+'vw'; c.style.background=cols[i%cols.length];
    c.style.animationDuration=(1.6+Math.random()*1.6)+'s'; c.style.animationDelay=(Math.random()*0.4)+'s';
    c.style.borderRadius = Math.random()>.5?'50%':'2px';
    document.body.appendChild(c); (function(el){ setTimeout(function(){ el.remove(); }, 3800); })(c);
  }
}
function pickDistractors(correct, pool, key, n){
  var seen={}; seen[correct[key]]=1; var out=[];
  var p = shuffle(pool);
  for(var i=0;i<p.length && out.length<n;i++){ var v=p[i][key]; if(!seen[v]){ seen[v]=1; out.push(v); } }
  if(out.length<n){
    var p2 = shuffle(ALLW);
    for(var j=0;j<p2.length && out.length<n;j++){ var v2=p2[j][key]; if(!seen[v2]){ seen[v2]=1; out.push(v2); } }
  }
  return out;
}

function breakdown(n){
  var parts=[];
  var th=Math.floor(n/1000), r=n%1000;
  function sub(x, fin){
    var out=[]; var h=Math.floor(x/100), rr=x%100;
    if(h>0) out.push({t:(h===1?'ein':ONES[h])+'hundert', u:h+'×100'});
    if(rr>0){
      if(rr<20) out.push({t:(rr===1&&!fin)?'ein':ONES[rr], u:String(rr)});
      else { var t=Math.floor(rr/10), u=rr%10; if(u>0){ out.push({t:u===1?'ein':ONES[u], u:String(u), p:1}); out.push({t:'und',u:'va'}); } out.push({t:TENS[t], u:String(t*10), p:u>0?1:0}); }
    }
    return out;
  }
  if(th>0){ parts = parts.concat(sub(th,false)); parts.push({t:'tausend',u:'×1000'}); }
  if(r>0) parts = parts.concat(sub(r,true));
  return parts;
}
function updateConv(){
  var v=document.getElementById('numIn').value, out=document.getElementById('numOut'), bd=document.getElementById('numBd');
  if(v===''){ out.textContent='—'; bd.innerHTML=''; return; }
  var n=parseInt(v,10);
  if(isNaN(n)||n<0||n>1000000){ out.textContent="0 dan 1 000 000 gacha son kiriting"; bd.innerHTML=''; return; }
  out.textContent = numDe(n);
  bd.innerHTML = (n>0 && n<1000000) ? breakdown(n).map(function(x){ return '<span class="'+(x.p?'p':'')+'">'+esc(x.t)+' <small class="muted">('+esc(x.u)+')</small></span>'; }).join('') : '';
}
function doNumSay(btn){
  var v=document.getElementById('numIn').value; var n=parseInt(v,10);
  if(isNaN(n)||n<0||n>1000000){ toast("Avval to'g'ri son kiriting"); return; }
  say(numDe(n), btn);
}

      '<div class="mt"><button class="btn btn-c" data-act="npCheck" '+(NP.answered?'style="display:none"':'')+'>Tekshirish</button></div>';
  } else {
    h += '<div class="ask">Bu qaysi son?</div><div class="prompt" style="font-size:28px">'+esc(numDe(n))+'</div><div>'+spk(numDe(n),'sm')+'</div><div class="opts">'+

  }
  h += '<div class="fb '+(NP.answered?(NP.lastOk?'ok':'bad'):'')+'">'+(NP.answered?(NP.lastOk?'✓ To\'g\'ri! ':'✗ To\'g\'ri javob: ')+'<b>'+n+'</b> — '+esc(numDe(n)):'')+'</div>'+

function afterNumPractice(){
  if(NP && !NP.finished && NP.mode==='listen'){
    var inp=document.getElementById('npIn');
    if(inp && !NP.answered){ inp.focus(); inp.addEventListener('keydown', function(e){ if(e.key==='Enter') npCheck(); }); }
  }
}
function npNewQ(){
  var L=NLEVELS[NP.level]; var n;
  do { n=rnd(L[0],L[1]); } while(NP.used[n] && Object.keys(NP.used).length < (L[1]-L[0]));
  NP.used[n]=1; NP.cur=n; NP.answered=false; NP.picked=null;
  if(NP.mode==='read'){
    var set={}; set[n]=1; var opts=[n];
    var s=String(n);
    if(s.length===2 && s[0]!==s[1]){ var rv=parseInt(s[1]+s[0],10); if(!set[rv]){ set[rv]=1; opts.push(rv); } }
    var tries=0;
    while(opts.length<4 && tries<200){ tries++; var c = Math.random()<.5 ? n+rnd(-12,12) : rnd(L[0],L[1]); if(c>=0 && !set[c]){ set[c]=1; opts.push(c); } }
    NP.opts=shuffle(opts);
  }
  render();
  if(NP.mode==='listen'){ var np0=NP; setTimeout(function(){ if(NP===np0 && NP.cur===n && current.view==='numbers') say(numDe(n)); }, 250); }
}
function npAnswer(ok){
  NP.answered=true; NP.lastOk=ok; if(ok){ NP.score++; } render();
  if(NP.mode==='read' || !ok) say(numDe(NP.cur));
}
function npCheck(){
  if(!NP||NP.answered) return;
  var v=document.getElementById('npIn').value;
  if(v===''){ toast("Raqamni yozing"); return; }
  npAnswer(parseInt(v,10)===NP.cur);
}

function buildVocabQuiz(){
  var pool = TCFG.cat==='all' ? ALLW : ALLW.filter(function(w){ return w.cat===TCFG.cat; });
  if(TCFG.mode==='art'){
    pool = pool.filter(function(w){ return wordArt(w) && !w.pl; });
    if(pool.length<4) pool = ALLW.filter(function(w){ return wordArt(w) && !w.pl; });
  }
  var catPool = pool;
  var picked = shuffle(pool).slice(0, Math.min(TCFG.n, pool.length));
  return picked.map(function(w){
    if(TCFG.mode==='art'){ var a=wordArt(w); return {type:'art', ask:"Artiklini tanlang", prompt:wordBare(w), sub:w.uz, options:['der','die','das'], answer:a, say:w.de, reveal:w.de, wid:w.id}; }
    if(TCFG.mode==='de2uz'){ return {type:'de2uz', ask:"Tarjimasini toping", prompt:w.de, sub:'['+w.tr+']', options:shuffle([w.uz].concat(pickDistractors(w,catPool,'uz',3))), answer:w.uz, say:w.de, autoSay:true, wid:w.id}; }
    if(TCFG.mode==='uz2de'){ return {type:'uz2de', ask:"Nemischasini toping", prompt:w.uz, sub:'', options:shuffle([w.de].concat(pickDistractors(w,catPool,'de',3))), answer:w.de, say:w.de, wid:w.id}; }
    return {type:'audio', ask:"Eshiting va ma'nosini toping", prompt:'', sub:'', options:shuffle([w.uz].concat(pickDistractors(w,catPool,'uz',3))), answer:w.uz, say:w.de, autoSay:true, reveal:w.de+'  ['+w.tr+']', wid:w.id};
  });
}
function buildLessonQuiz(id){
  var l=LESSONS.filter(function(x){ return x.id===id; })[0];
  var others = allPhrases();
  var items = shuffle(l.items).slice(0, 8);
  return items.map(function(it, k){
    var rev = k%2===1;
    var pool = shuffle(l.items.filter(function(x){ return x!==it; })).concat(shuffle(others));
    var seen={}, opts=[];
    var key = rev ? 'de' : 'uz';
    seen[it[key]]=1;
    for(var i=0;i<pool.length && opts.length<3;i++){ if(!seen[pool[i][key]]){ seen[pool[i][key]]=1; opts.push(pool[i][key]); } }
    if(rev) return {type:'uz2de', ask:"Nemischasini toping", prompt:it.uz, sub:'', options:shuffle([it.de].concat(opts)), answer:it.de, say:it.de};
    return {type:'de2uz', ask:"Tarjimasini toping", prompt:it.de, sub:'['+it.tr+']', options:shuffle([it.uz].concat(opts)), answer:it.uz, say:it.de, autoSay:true};
  });
}

var GAME_VIEW = {}, GAME_AFTER = {};
function initGame(id){
  G = {id:id};
  if(id==='memory'){
    var cats = VOCAB.filter(function(c){ return c.w.length>=6; });
    var cat = G.cat || cats[rnd(0,cats.length-1)].id;
    var ws = shuffle(ALLW.filter(function(w){ return w.cat===cat; })).slice(0,6);
    var cards=[]; ws.forEach(function(w){ cards.push({wid:w.id, t:w.de, de:1}); cards.push({wid:w.id, t:w.uz, de:0}); });
    G.cat=cat; G.cards=shuffle(cards); G.open=[]; G.got={}; G.moves=0; G.start=Date.now(); G.lock=false; G.over=false;
  }
  if(id==='scramble'){
    G.list = shuffle(ALLW.filter(function(w){ var b=wordBare(w); return /^[A-Za-zÄÖÜäöüß]{3,9}$/.test(b); })).slice(0,8);
    G.i=0; G.score=0; scrSetup();
  }
  if(id==='sentence'){
    G.list = shuffle(allPhrases().filter(function(p){ var n=p.de.split(' ').length; return n>=3 && n<=7 && p.de.indexOf('/')<0; })).slice(0,6);
    G.i=0; G.score=0; senSetup();
  }
  if(id==='dictation'){
    G.list = shuffle(ALLW.filter(function(w){ var b=wordBare(w); return b.length>=3 && b.length<=11 && b.indexOf('-')<0; })).slice(0,10);
    G.i=0; G.score=0; G.answered=false;
  }
  if(id==='speed'){ G.started=false; G.over=false; G.score=0; G.wrongN=0; G.left=60; }
}
function restartGame(){ var id=G.id, cat=null; G=null; initGame(id); render(); }

GAME_VIEW.memory = function(){

  if(G.over){
    var sc=Math.max(10, 100-(G.moves-6)*6); var isNew=setBest('memory',sc);
    if(!G.xpGiven){ G.xpGiven=1; addXp(Math.round(sc/5)); if(isNew) confetti(); }
    return gameOverHtml("Hammasi topildi!", sc+' ball', Math.round(sc/5), isNew, '<p class="muted">'+G.moves+' ta urinish · '+Math.round((G.end-G.start)/1000)+' soniya</p>');
  }
  var h = '<div class="gtop"><div class="pill">'+cat.icon+' '+esc(cat.title)+'</div><div class="toolbar"><div class="pill c">Urinishlar: '+G.moves+'</div><button class="btn btn-o btn-s" data-act="gRestart">🔀 Boshqa so\'zlar</button></div></div><div class="mem">';
  G.cards.forEach(function(c,k){
    var open = G.open.indexOf(k)>-1, got=G.got[c.wid];
    h += '<button class="mc '+(open?'open':'')+(got?' got':'')+'" id="mc'+k+'" data-act="memFlip" data-p="'+k+'"><div class="in"><div class="f"></div><div class="b '+(c.de?'de':'')+'">'+(c.de?artHtml(c.t):esc(c.t))+'</div></div></button>';
  });

};
function memFlip(k){
  if(G.lock || G.open.indexOf(k)>-1) return;
  var c=G.cards[k]; if(G.got[c.wid]) return;
  G.open.push(k);
  document.getElementById('mc'+k).classList.add('open');
  if(c.de) say(c.t);
  if(G.open.length===2){
    G.moves++; G.lock=true;
    var a=G.cards[G.open[0]], b=G.cards[G.open[1]];
    if(a.wid===b.wid && a.de!==b.de){
      setTimeout(function(){
        G.got[a.wid]=1; state.learned[a.wid]=1; G.open=[]; G.lock=false;
        if(Object.keys(G.got).length===6){ G.over=true; G.end=Date.now(); saveState(); }
        render();
      }, 450);
    } else {
      setTimeout(function(){
        G.open.forEach(function(i){ var el=document.getElementById('mc'+i); if(el) el.classList.add('shake'); });
      }, 350);
      setTimeout(function(){ G.open=[]; G.lock=false; render(); }, 1100);
    }
  }
}

/* Scramble */
function scrSetup(){
  var w=G.list[G.i]; var word=wordBare(w);
  var letters=word.split('');
  var mix; var t=0;
  do { mix=shuffle(letters.map(function(ch,i){ return {ch:ch, i:i}; })); t++; } while(mix.map(function(x){return x.ch;}).join('')===word && t<20);
  G.word=word; G.w=w; G.tiles=mix; G.used={}; G.ans=[]; G.status=''; G.hints=0;
}
GAME_VIEW.scramble = function(){
  if(G.i>=G.list.length){
    var isNew=setBest('scramble',G.score); if(!G.xpGiven){ G.xpGiven=1; addXp(G.score*8); if(isNew&&G.score>0) confetti(); }
    return gameOverHtml("O'yin tugadi!", G.score+' / '+G.list.length, G.score*8, isNew);
  }
  var w=G.w, a=wordArt(w);
  var h='<div class="qwrap"><div class="qhead"><span>'+(G.i+1)+' / '+G.list.length+'</span><span>✓ '+G.score+'</span></div><div class="pbar"><i style="width:'+(G.i/G.list.length*100)+'%"></i></div>'+
    '<div class="qcard"><div class="ask">Harflardan so\'z tuzing</div><div class="prompt" style="font-size:28px">'+esc(w.uz)+'</div>'+(a?'<div class="sub">Artikli: <span class="art '+a+'">'+a+'</span></div>':'')+
    '<div class="mt">'+spk(w.de,'sm')+' <span class="muted" style="font-size:13px">ovozli yordam</span></div>'+
    '<div class="slots '+G.status+'">'+G.ans.map(function(ti, k){ return '<button class="lt" data-act="scrBack" data-p="'+k+'">'+esc(G.tiles[ti].ch)+'</button>'; }).join('')+'</div>'+
    '<div class="pool">'+G.tiles.map(function(t,k){ return '<button class="lt '+(G.used[k]?'used':'')+'" data-act="scrPick" data-p="'+k+'">'+esc(t.ch)+'</button>'; }).join('')+'</div>'+
    '<div class="fb '+(G.status==='ok'?'ok':(G.status==='bad'?'bad':''))+'">'+(G.status==='ok'?'✓ To\'g\'ri! '+artHtml(w.de):(G.status==='bad'?'✗ Yana urinib ko\'ring':''))+'</div>'+
    '<div class="toolbar mt" style="justify-content:center">'+(G.status==='ok'?'<button class="btn btn-n" data-act="scrNext">Keyingi →</button>':'<button class="btn btn-o btn-s" data-act="scrClear">↺ Tozalash</button><button class="btn btn-o btn-s" data-act="scrHint">💡 Yordam</button><button class="btn btn-o btn-s" data-act="scrSkip">O\'tkazib yuborish →</button>')+'</div></div></div>';
  return h;
};
function scrCheck(){
  if(G.ans.length!==G.tiles.length) return;
  var s=G.ans.map(function(ti){ return G.tiles[ti].ch; }).join('');
  if(s===G.word){ G.status='ok'; if(G.hints<2){ G.score++; } state.learned[G.w.id]=1; saveState(); say(G.w.de); }
  else G.status='bad';
}
function scrHint(){
  /* to'g'ri prefiksni qoldirib, keyingi to'g'ri harfni qo'yadi */
  var cur=G.ans.map(function(ti){ return G.tiles[ti].ch; }).join('');
  var k=0; while(k<G.ans.length && cur[k]===G.word[k]) k++;
  var keep=G.ans.slice(0,k); G.used={}; keep.forEach(function(ti){ G.used[ti]=1; }); G.ans=keep;
  if(k>=G.word.length) return;
  var need=G.word[k];
  for(var i=0;i<G.tiles.length;i++){ if(!G.used[i] && G.tiles[i].ch===need){ G.used[i]=1; G.ans.push(i); break; } }
  G.hints++; G.status=''; scrCheck();
}

/* Sentence */
function senSetup(){
  var p=G.list[G.i];
  var toks=p.de.replace(/[.!?]+$/,'').split(' ').map(function(t){ return t.replace(/,$/,''); });
  var mix, t=0;
  do { mix=shuffle(toks.map(function(x,i){ return {t:x, i:i}; })); t++; } while(mix.map(function(x){return x.t;}).join(' ')===toks.join(' ') && t<20);
  G.p=p; G.toks=toks; G.tiles=mix; G.used={}; G.ans=[]; G.status='';
}

    '<div class="fb '+(G.status==='ok'?'ok':(G.status==='bad'?'bad':''))+'">'+(G.status==='ok'?'✓ Ajoyib! '+esc(G.p.de):(G.status==='bad'?'✗ Tartib noto\'g\'ri — so\'zni bosib qaytaring':''))+'</div>'+

function spNewQ(){
  var w=ALLW[rnd(0,ALLW.length-1)];

  if(!truth){ shown = pickDistractors(w, ALLW.filter(function(x){ return x.cat===w.cat; }), 'uz', 1)[0]; }

function spAnswer(yes){
  if(!G.started||G.over) return;
  var ok = (yes===G.q.truth);
  if(ok) G.score++; else G.wrongN++;
  var card=document.getElementById('spCard');
  spNewQ(); render();
  var c2=document.getElementById('spCard'); if(c2){ c2.style.boxShadow = ok?'0 0 0 4px var(--ok)':'0 0 0 4px var(--bad)'; setTimeout(function(){ if(c2) c2.style.boxShadow=''; }, 250); }
}
function spStart(){
  G.started=true; G.left=60; G.score=0; G.wrongN=0; spNewQ(); render();
  var timer=setInterval(function(){
    G.left--; var t=document.getElementById('spT'); if(t) t.textContent=G.left;
    if(G.left<=0){ clearInterval(timer); G.over=true; render(); }
  }, 1000);
  var key=function(e){ if(e.key==='ArrowLeft') spAnswer(true); if(e.key==='ArrowRight') spAnswer(false); };
  document.addEventListener('keydown', key);
  cleanups.push(function(){ clearInterval(timer); document.removeEventListener('keydown', key); });
}

}
function closeModal(){ document.getElementById('modal').classList.remove('show'); saveState(); if(current.view==='home') render(); }

/* =====================================================================
   HODISALAR (event delegation)
   ===================================================================== */
var ACT = {
  go: function(el){ go(el.dataset.v, el.dataset.p||null); },
  say: function(el){ say(el.dataset.say, el.classList.contains('spk')?el:null); },
  sayslow: function(el){ say(el.dataset.say, el, true); },
  stop: function(){ TTS.stop(); clearActive(); },
  openDrawer: openDrawer, closeDrawer: closeDrawer,
  openSettings: openSettings, closeModal: closeModal,
  installVoice: function(){ if(NATIVE){ try{ window.AndroidTTS.installVoice(); }catch(e){ toast("Ochib bo'lmadi"); } } },
  ttsSettings: function(){ if(NATIVE){ try{ window.AndroidTTS.openSettings(); }catch(e){ toast("Ochib bo'lmadi"); } } },
  testVoice: function(){ say("Hallo! Ich heiße Anna. Wie geht es Ihnen?"); },
  resetAsk: function(el){
    if(el.dataset.sure){ var keep=state.settings; state={xp:0,streak:0,lastDay:'',learned:{},lessons:{},best:{},settings:keep,ts:0}; saveState(); if(HAS_GAS){ try{ google.script.run.resetProgress(); }catch(e){} } closeModal(); render(); toast("Progress tozalandi"); return; }
    el.dataset.sure='1'; el.textContent="⚠️ Ha, hammasini o'chirish"; el.style.borderColor='var(--bad)'; el.style.color='var(--bad)';
  },
  abcAll: function(){ TTS.sequence(ALPHABET.map(function(a){ return {text:a[2]}; }), function(){}, null); },
  playLesson: function(){
    var l=LESSONS.filter(function(x){ return x.id===current.p; })[0]||LESSONS[0];
    TTS.sequence(l.items.map(function(it){ return {text:it.de}; }), function(i){
      clearActive(); if(i<0) return; var el=document.getElementById('ph'+i); if(el){ el.classList.add('active'); el.scrollIntoView({block:'center', behavior:'smooth'}); }
    });
  },
  playDialog: function(){
    var d=DIALOGS.filter(function(x){ return x.id===current.p; })[0]||DIALOGS[0];
    TTS.sequence(d.lines.map(function(ln){ return {text:ln.de, b:ln.s==='B'}; }), function(i){
      clearActive(); if(i<0) return; var el=document.getElementById('bl'+i); if(el){ el.classList.add('active'); el.scrollIntoView({block:'center', behavior:'smooth'}); }
    });
  },
  toggleUz: function(){ document.getElementById('dlg').classList.toggle('hide-uz'); },
  lessonQuiz: function(el){ var l=LESSONS.filter(function(x){ return x.id===el.dataset.p; })[0]; startQuiz(buildLessonQuiz(l.id), l.title, ['lesson', l.title], l.id); },
  numTab: function(el){ numTab=el.dataset.p; go('numbers'); },
  numSay: function(el){ doNumSay(el); },
  numRand: function(){ var inp=document.getElementById('numIn'); var r=[rnd(0,100),rnd(100,999),rnd(1000,9999),rnd(1900,2030)][rnd(0,3)]; inp.value=r; updateConv(); say(numDe(r)); },
  npMode: function(el){ NPCFG.mode=el.dataset.p; render(); },
  npLevel: function(el){ NPCFG.level=el.dataset.p; render(); },
  npStart: function(){ NP={mode:NPCFG.mode, level:NPCFG.level, i:0, score:0, total:10, used:{}, finished:false}; npNewQ(); },
  npPlay: function(el){ say(numDe(NP.cur), el); },
  npPlaySlow: function(el){ say(numDe(NP.cur), el, true); },
  npCheck: npCheck,
  npPick: function(el){ if(NP.answered) return; var v=parseInt(el.dataset.p,10); NP.picked=v; npAnswer(v===NP.cur); },
  npNext: function(){ NP.i++; if(NP.i>=NP.total){ NP.finished=true; addXp(NP.score*5); if(NP.score>=8) confetti(); render(); } else npNewQ(); },
  vcat: function(el){ vocabCat=el.dataset.p; vocabLimit=120; render(); },
  vmore: function(){ vocabLimit+=200; document.getElementById('vlist').innerHTML=vocabListHtml(); },
  startFlash: function(){ var pool = vocabCat==='all'? ALLW : ALLW.filter(function(w){ return w.cat===vocabCat; }); var unk = pool.filter(function(w){ return !state.learned[w.id]; }); FC={deck:shuffle(unk.length?unk:pool).slice(0,20), flip:false}; go('flash'); },
  flip: function(){ FC.flip=!FC.flip; var el=document.getElementById('fc'); if(el) el.classList.toggle('flip', FC.flip); if(FC.flip) say(FC.deck[0].de); },
  fcKnow: function(){ var w=FC.deck.shift(); state.learned[w.id]=1; touchDay(); state.xp+=2; saveState(); FC.flip=false; render(); },
  fcAgain: function(){ var w=FC.deck.shift(); FC.deck.push(w); FC.flip=false; render(); },
  tMode: function(el){ TCFG.mode=el.dataset.p; document.querySelectorAll('[data-act="tMode"]').forEach(function(b){ b.classList.toggle('on', b.dataset.p===TCFG.mode); }); },
  tStart: function(){ var qs=buildVocabQuiz(); if(qs.length<2){ toast("Bu bo'limda yetarli so'z yo'q"); return; } var m=QMODES.filter(function(x){ return x[0]===TCFG.mode; })[0]; startQuiz(qs, m[2], ['tests','Testlar']); },
  qPick: function(el){
    if(QZ.answered) return;
    var q=QZ.qs[QZ.i], o=q.options[parseInt(el.dataset.p,10)];
    QZ.picked=o; QZ.answered=true;
    if(o===q.answer){ QZ.score++; touchDay(); state.xp+=10; if(q.wid) state.learned[q.wid]=1; saveState(); }
    else QZ.wrong.push(q);
    render();
    if(q.type!=='de2uz' || o!==q.answer) say(q.say);
  },
  qNext: function(){
    QZ.i++; QZ.answered=false; QZ.picked=null; QZ.spoken=false;
    if(QZ.i>=QZ.qs.length){
      QZ.done=true;
      var pct=Math.round(QZ.score/QZ.qs.length*100);
      if(QZ.lessonId && pct>=70){ state.lessons[QZ.lessonId]=Math.max(pct, state.lessons[QZ.lessonId]||0); state.xp+=30; }
      saveState(); if(pct>=70) confetti();
    }
    render(); window.scrollTo(0,0);
  },
  qRetry: function(){
    if(QZ.lessonId){ var id=QZ.lessonId; var l=LESSONS.filter(function(x){ return x.id===id; })[0]; startQuiz(buildLessonQuiz(id), l.title, ['lesson', l.title], id); }
    else { var m=QMODES.filter(function(x){ return x[0]===TCFG.mode; })[0]; startQuiz(buildVocabQuiz(), m[2], ['tests','Testlar']); }
  },
  gRestart: function(){ restartGame(); },
  memFlip: function(el){ memFlip(parseInt(el.dataset.p,10)); },
  scrPick: function(el){ var k=+el.dataset.p; if(G.used[k]||G.status==='ok') return; G.used[k]=1; G.ans.push(k); G.status=''; scrCheck(); render(); },
  scrBack: function(el){ if(G.status==='ok') return; var k=+el.dataset.p; var ti=G.ans[k]; G.ans.splice(k,1); delete G.used[ti]; G.status=''; render(); },
  scrClear: function(){ G.ans=[]; G.used={}; G.status=''; render(); },
  scrHint: function(){ scrHint(); render(); },
  scrSkip: function(){ G.i++; if(G.i<G.list.length) scrSetup(); render(); },
  scrNext: function(){ G.i++; if(G.i<G.list.length) scrSetup(); render(); },
  senPick: function(el){ var k=+el.dataset.p; if(G.used[k]||G.status==='ok') return; G.used[k]=1; G.ans.push(k); G.status=''; senCheck(); render(); },
  senBack: function(el){ if(G.status==='ok') return; var k=+el.dataset.p; var ti=G.ans[k]; G.ans.splice(k,1); delete G.used[ti]; G.status=''; render(); },
  senClear: function(){ G.ans=[]; G.used={}; G.status=''; render(); },
  senSkip: function(){ G.i++; if(G.i<G.list.length) senSetup(); render(); },
  senNext: function(){ G.i++; if(G.i<G.list.length) senSetup(); render(); },
  dicPlay: function(el){ say(G.list[G.i].de, el); },
  dicSlow: function(el){ say(G.list[G.i].de, el, true); },
  dicIns: function(el){ var inp=document.getElementById('dicIn'); var s=inp.selectionStart==null?inp.value.length:inp.selectionStart, e=inp.selectionEnd==null?s:inp.selectionEnd; inp.value=inp.value.slice(0,s)+el.dataset.p+inp.value.slice(e); inp.focus(); try{ inp.setSelectionRange(s+1,s+1); }catch(x){} },
  dicCheck: dicCheck,
  dicNext: function(){ G.i++; G.answered=false; render(); },
  spStart: spStart,
  spAns: function(el){ spAnswer(el.dataset.p==='1'); }
};
function clearActive(){ document.querySelectorAll('.phr.active,.bub.active').forEach(function(e){ e.classList.remove('active'); }); }
document.addEventListener('click', function(e){
  var t=e.target.closest('[data-act]'); if(!t) return;
  var a=ACT[t.dataset.act]; if(a){ e.preventDefault(); a(t, e); }
});
document.getElementById('modal').addEventListener('click', function(e){ if(e.target.id==='modal') closeModal(); });

/* =====================================================================

render();
TTS.init();
loadState(function(changed){ if(changed) render(); else renderXp(); });
